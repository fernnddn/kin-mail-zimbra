---
- name: Install the DRBD utility packages from the Ubuntu archive
  ansible.builtin.apt:
    name: "{{ drbd_install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [drbd, install, packages]

- name: Ensure the DRBD DKMS packages are not installed
  ansible.builtin.apt:
    name: "{{ drbd_install_forbid_packages }}"
    state: absent
  tags: [drbd, install, packages]
