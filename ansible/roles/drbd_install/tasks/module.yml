---
# apt supports check mode. modprobe is a mutation — keep Ansible default check
# behaviour (do not set check_mode: false). Under --check this task is skipped
# via `when: not ansible_check_mode` so a dry-run never loads modules on the host.

- name: Memuat modul kernel DRBD in-tree
  ansible.builtin.command:
    cmd: modprobe {{ drbd_install_module }}
  when: not ansible_check_mode
  changed_when: true
  tags: [drbd, install, module]
