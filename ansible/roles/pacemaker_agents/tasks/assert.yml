---
- name: Deploy the no-dual-primary assert script
  ansible.builtin.copy:
    src: kin-assert-no-dual-primary.sh
    dest: "{{ pacemaker_agents_assert_path }}"
    owner: root
    group: root
    mode: "0755"
  register: pacemaker_agents_assert_copy
  tags: [pacemaker, agents, assert]

- name: Note whether the assert script differs from the live version
  ansible.builtin.debug:
    msg: >-
      {% if pacemaker_agents_assert_copy is changed %}
      The assert helper DIFFERS or does not exist at {{ pacemaker_agents_assert_path }}
      (Host B may not have a copy yet - the role will deploy it).
      {% else %}
      The live assert helper matches ({{ pacemaker_agents_assert_path }}).
      {% endif %}
  tags: [pacemaker, agents, assert]
