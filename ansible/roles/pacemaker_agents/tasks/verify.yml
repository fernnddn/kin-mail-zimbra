---
- name: Verify the resource-agents-extra package is installed
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Package} ${Version}\n' resource-agents-extra
  register: pacemaker_agents_pkg
  changed_when: false
  failed_when: pacemaker_agents_pkg.rc != 0
  check_mode: false
  tags: [pacemaker, agents, verify]

- name: Verify the Zimbra OCF agent is readable
  ansible.builtin.stat:
    path: "{{ pacemaker_agents_ocf_path }}"
  register: pacemaker_agents_ocf_stat
  check_mode: false
  failed_when: >-
    not pacemaker_agents_ocf_stat.stat.exists or
    not pacemaker_agents_ocf_stat.stat.executable
  tags: [pacemaker, agents, verify]

- name: Verify the Zimbra OCF meta-data is valid
  ansible.builtin.command:
    cmd: "{{ pacemaker_agents_ocf_path }} meta-data"
  register: pacemaker_agents_ocf_meta
  changed_when: false
  failed_when: >-
    pacemaker_agents_ocf_meta.rc != 0 or
    ('resource-agent' not in pacemaker_agents_ocf_meta.stdout)
  environment:
    OCF_ROOT: /usr/lib/ocf
  check_mode: false
  tags: [pacemaker, agents, verify]

- name: Verify the fail2ban jail helper is executable
  ansible.builtin.stat:
    path: "{{ pacemaker_agents_fail2ban_jails_path }}"
  register: pacemaker_agents_fail2ban_jails_stat
  check_mode: false
  failed_when: >-
    not pacemaker_agents_fail2ban_jails_stat.stat.exists or
    not pacemaker_agents_fail2ban_jails_stat.stat.executable
  tags: [pacemaker, agents, verify]

- name: Verify the systemd drbd service is disabled
  ansible.builtin.command:
    cmd: systemctl is-enabled drbd.service
  register: pacemaker_agents_drbd_enabled
  changed_when: false
  failed_when: pacemaker_agents_drbd_enabled.stdout | trim != "disabled"
  check_mode: false
  tags: [pacemaker, agents, verify]
