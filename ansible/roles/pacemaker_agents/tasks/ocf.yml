---
# copy/template are check-mode safe: under --check Ansible reports whether the
# live OCF differs from the role file (changed=true) without writing.

- name: Prepare the kin OCF provider directory
  ansible.builtin.file:
    path: "{{ pacemaker_agents_ocf_provider_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [pacemaker, agents, ocf]

- name: Check the kin OCF provider directory exists (dry-run)
  ansible.builtin.stat:
    path: "{{ pacemaker_agents_ocf_provider_dir }}"
  register: pacemaker_agents_ocf_dir_stat
  check_mode: false
  tags: [pacemaker, agents, ocf]

- name: Deploy the Zimbra OCF agent (ocf:kin:zimbra)
  ansible.builtin.copy:
    src: zimbra
    dest: "{{ pacemaker_agents_ocf_path }}"
    owner: root
    group: root
    mode: "0755"
  register: pacemaker_agents_ocf_copy
  when: not ansible_check_mode or pacemaker_agents_ocf_dir_stat.stat.exists
  tags: [pacemaker, agents, ocf]

- name: Deploy the fail2ban jail helper used by ocf:kin:zimbra
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../install/lib/kin-fail2ban-jails.sh"
    dest: "{{ pacemaker_agents_fail2ban_jails_path }}"
    owner: root
    group: root
    mode: "0755"
  register: pacemaker_agents_fail2ban_jails_copy
  tags: [pacemaker, agents, ocf]

- name: Note whether the Zimbra OCF differs from the live version
  ansible.builtin.debug:
    msg: >-
      {% if pacemaker_agents_ocf_copy is defined and pacemaker_agents_ocf_copy is changed %}
      The live OCF DIFFERS or does not exist yet — the role will write
      {{ pacemaker_agents_ocf_path }} (run with --diff for details).
      {% else %}
      The live OCF matches the role file or the install was skipped
      ({{ pacemaker_agents_ocf_path }}).
      {% endif %}
  tags: [pacemaker, agents, ocf]
