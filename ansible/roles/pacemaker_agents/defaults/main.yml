---
# Packages + agents from Pacemaker mail-stack stage (Filesystem / IPaddr2 / custom OCF).
pacemaker_agents_packages:
  - resource-agents-extra
pacemaker_agents_ocf_provider_dir: /usr/lib/ocf/resource.d/kin
pacemaker_agents_ocf_path: /usr/lib/ocf/resource.d/kin/zimbra
pacemaker_agents_fail2ban_jails_path: /usr/local/sbin/kin-fail2ban-jails
pacemaker_agents_assert_path: /usr/local/sbin/kin-assert-no-dual-primary.sh
# Pacemaker owns DRBD bring-up; systemd drbd.service must stay disabled (2.7).
pacemaker_agents_disable_drbd_service: true
# Zimbra SysV (/etc/init.d/zimbra) would start on reboot in parallel with
# ocf:kin:zimbra and fight the mount. Disable boot start; Pacemaker starts it.
pacemaker_agents_disable_zimbra_service: true
pacemaker_agents_keep_meta_loop_unit: kin-drbd-meta-loop.service
pacemaker_agents_luks_dropin_dir: /etc/systemd/system/pacemaker.service.d
pacemaker_agents_luks_dropin_path: /etc/systemd/system/pacemaker.service.d/kin-luks-cryptsetup.conf
# The crypttab name kin-zimbra-crypt does NOT map to a unit of the same name:
# systemd escapes instance names, so the generated unit is
# systemd-cryptsetup@kin\x2dzimbra\x2dcrypt.service. Believing otherwise is
# what pointed Requires= at a unit that never existed.
# The LUKS mapper backing /opt/zimbra. systemd names its generated unit after
# the ESCAPED form of this - a dash becomes \x2d - so the unit name is derived
# on the host with systemd-escape rather than written out here. Getting that
# wrong points Requires= at a unit that does not exist, and Pacemaker then
# refuses to start at all: a node that goes down cannot rejoin the cluster.
pacemaker_agents_luks_mapper_name: >-
  {{ drbd_resource_luks_mapper_name | default('kin-zimbra-crypt') }}
# Fallback only. tasks/systemd.yml overrides this with the escaped name that
# systemd-escape returns on the host.
pacemaker_agents_luks_cryptsetup_unit: >-
  systemd-cryptsetup@{{
    pacemaker_agents_luks_mapper_name | trim | replace('-', '\x2d')
  }}.service
