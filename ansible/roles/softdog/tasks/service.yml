---
- name: Memasang unit systemd kin-softdog
  ansible.builtin.template:
    src: kin-softdog.service.j2
    dest: /etc/systemd/system/{{ softdog_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Muat ulang systemd setelah perubahan kin-softdog
  when: not ansible_check_mode
  tags: [softdog, service]

- name: Memeriksa unit kin-softdog sudah terpasang (dry-run)
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ softdog_service_name }}.service
  register: softdog_unit_stat
  check_mode: false
  tags: [softdog, service]

- name: Mengaktifkan layanan kin-softdog agar ikut boot
  ansible.builtin.systemd:
    name: "{{ softdog_service_name }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or softdog_unit_stat.stat.exists
  tags: [softdog, service]

- name: Menjalankan layanan kin-softdog
  ansible.builtin.systemd:
    name: "{{ softdog_service_name }}"
    state: started
  when: not ansible_check_mode or softdog_unit_stat.stat.exists
  tags: [softdog, service]
