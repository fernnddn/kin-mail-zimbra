---
- name: Verify the kin-softdog service is active
  ansible.builtin.command:
    cmd: systemctl is-active {{ softdog_service_name }}
  register: softdog_active
  changed_when: false
  failed_when: softdog_active.stdout | trim != "active"
  check_mode: false
  tags: [softdog, verify]

- name: Verify the watchdog device is available
  ansible.builtin.stat:
    path: /dev/watchdog
  register: softdog_watchdog_dev
  failed_when: not softdog_watchdog_dev.stat.exists
  check_mode: false
  tags: [softdog, verify]

- name: Note the dry-run limits for softdog reboot proof
  ansible.builtin.debug:
    msg: >-
      Verification only confirms kin-softdog is active and /dev/watchdog exists.
      Proof of a real watchdog reboot (boot_id change) requires a test like
      softdog stage and is NOT run against the production cluster through this playbook.
  tags: [softdog, verify]
