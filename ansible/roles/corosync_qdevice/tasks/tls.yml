---
# TLS flow from task 2.2 (manual because mon has no pcsd):
#   copy CA from qnetd → init/request on first mail node → sign on mon →
#   import (-M) → distribute PKCS#12 to peers (-m).
#
# Idempotency marker: NSS cert9.db (present on every fully wired node).
# PKCS#12 may exist only on the node that ran -M; peers often have NSS only.
# Mutating steps require not ansible_check_mode (no apply on live lab).

- name: Check the qdevice certificate database on the mail hosts
  ansible.builtin.stat:
    path: "{{ corosync_qdevice_nssdb_cert9 }}"
  register: corosync_qdevice_nss
  tags: [qdevice, tls]

- name: Flag whether all mail hosts already have qdevice TLS
  ansible.builtin.set_fact:
    corosync_qdevice_tls_ready_all: >-
      {{ ansible_play_hosts |
         map('extract', hostvars, 'corosync_qdevice_nss') |
         map(attribute='stat.exists') |
         min }}
  run_once: true
  tags: [qdevice, tls]

- name: Prepare the certificate working directory on the controller
  ansible.builtin.file:
    path: "{{ corosync_qdevice_controller_workdir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Fetch the CA certificate from the Monitoring VM
  ansible.builtin.fetch:
    src: "{{ corosync_qdevice_qnetd_cacert_remote }}"
    dest: "{{ corosync_qdevice_controller_workdir }}/qnetd-cacert.crt"
    flat: true
  delegate_to: "{{ corosync_qdevice_qnetd_inventory_host }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Copy the qnetd CA certificate to the mail hosts
  ansible.builtin.copy:
    src: "{{ corosync_qdevice_controller_workdir }}/qnetd-cacert.crt"
    dest: "{{ corosync_qdevice_cacert_local }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not corosync_qdevice_nss.stat.exists
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Initialize the qdevice certificate database
  ansible.builtin.command:
    cmd: >-
      corosync-qdevice-net-certutil -i -c {{ corosync_qdevice_cacert_local }}
    creates: "{{ corosync_qdevice_nssdb_cert9 }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Create the qdevice certificate request
  ansible.builtin.command:
    cmd: >-
      corosync-qdevice-net-certutil -r -n {{ corosync_qdevice_cluster_name }}
    creates: "{{ corosync_qdevice_crq_path }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Upload the certificate request to the controller
  ansible.builtin.fetch:
    src: "{{ corosync_qdevice_crq_path }}"
    dest: "{{ corosync_qdevice_controller_workdir }}/qdevice-net-node.crq"
    flat: true
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Copy the certificate request to the Monitoring VM
  ansible.builtin.copy:
    src: "{{ corosync_qdevice_controller_workdir }}/qdevice-net-node.crq"
    dest: /tmp/qdevice-net-node.crq
    mode: "0644"
  delegate_to: "{{ corosync_qdevice_qnetd_inventory_host }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Sign the qdevice certificate on the Monitoring VM
  ansible.builtin.command:
    cmd: >-
      corosync-qnetd-certutil -s -c /tmp/qdevice-net-node.crq
      -n {{ corosync_qdevice_cluster_name }}
    chdir: /etc/corosync/qnetd/nssdb
    creates: "/etc/corosync/qnetd/nssdb/{{ corosync_qdevice_signed_cert_name }}"
  delegate_to: "{{ corosync_qdevice_qnetd_inventory_host }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Fetch the signed certificate
  ansible.builtin.fetch:
    src: "/etc/corosync/qnetd/nssdb/{{ corosync_qdevice_signed_cert_name }}"
    dest: "{{ corosync_qdevice_controller_workdir }}/{{ corosync_qdevice_signed_cert_name }}"
    flat: true
  delegate_to: "{{ corosync_qdevice_qnetd_inventory_host }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Copy the signed certificate to the primary mail host
  ansible.builtin.copy:
    src: "{{ corosync_qdevice_controller_workdir }}/{{ corosync_qdevice_signed_cert_name }}"
    dest: "/etc/corosync/qdevice/net/nssdb/{{ corosync_qdevice_signed_cert_name }}"
    mode: "0640"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Import the cluster certificate into the qdevice database
  ansible.builtin.command:
    cmd: >-
      corosync-qdevice-net-certutil -M
      -c /etc/corosync/qdevice/net/nssdb/{{ corosync_qdevice_signed_cert_name }}
    creates: "{{ corosync_qdevice_p12_path }}"
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Fetch the PKCS12 file for distribution to the other nodes
  ansible.builtin.fetch:
    src: "{{ corosync_qdevice_p12_path }}"
    dest: "{{ corosync_qdevice_controller_workdir }}/qdevice-net-node.p12"
    flat: true
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Copy the qdevice PKCS12 to mail hosts that do not have NSS yet
  ansible.builtin.copy:
    src: "{{ corosync_qdevice_controller_workdir }}/qdevice-net-node.p12"
    dest: "{{ corosync_qdevice_p12_path }}"
    mode: "0600"
  when:
    - not corosync_qdevice_nss.stat.exists
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Import the qdevice PKCS12 on the secondary mail host
  ansible.builtin.command:
    cmd: >-
      corosync-qdevice-net-certutil -m -c {{ corosync_qdevice_p12_path }}
  when:
    - not corosync_qdevice_nss.stat.exists
    - not ansible_check_mode
  tags: [qdevice, tls]

- name: Note that qdevice TLS is not proven from scratch during a dry-run
  ansible.builtin.debug:
    msg: >-
      One or more hosts do not have {{ corosync_qdevice_nssdb_cert9 }} yet.
      Under --check the mutating TLS steps are skipped (not greenfield proof).
  run_once: true
  when:
    - not corosync_qdevice_tls_ready_all
    - ansible_check_mode
  tags: [qdevice, tls]
