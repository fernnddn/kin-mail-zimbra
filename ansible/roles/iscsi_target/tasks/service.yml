---
- name: Enable the iSCSI target service at boot
  ansible.builtin.systemd:
    name: "{{ iscsi_target_service }}"
    enabled: true
  tags: [iscsi, target, service]

- name: Start the iSCSI target service
  ansible.builtin.systemd:
    name: "{{ iscsi_target_service }}"
    state: started
  tags: [iscsi, target, service]
