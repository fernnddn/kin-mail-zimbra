---
- name: Verify the iSCSI target service is active
  ansible.builtin.command:
    cmd: systemctl is-active {{ iscsi_target_service }}
  register: iscsi_target_active
  changed_when: false
  failed_when: iscsi_target_active.stdout | trim != "active"
  check_mode: false
  tags: [iscsi, target, verify]

- name: Verify the iSCSI portal is listening on port 3260
  ansible.builtin.wait_for:
    port: "{{ iscsi_target_portal_port }}"
    host: 127.0.0.1
    timeout: 10
    state: started
  check_mode: false
  tags: [iscsi, target, verify]

- name: Verify the SBD LUN image exists on disk
  ansible.builtin.stat:
    path: "{{ iscsi_target_lun_img }}"
  register: iscsi_target_lun_verify
  failed_when: not iscsi_target_lun_verify.stat.exists
  check_mode: false
  tags: [iscsi, target, verify]

- name: Verify targetcli shows the SBD IQN
  ansible.builtin.command:
    cmd: targetcli ls /iscsi/{{ iscsi_target_iqn }}
  register: iscsi_target_ls_verify
  changed_when: false
  failed_when: iscsi_target_ls_verify.rc != 0
  check_mode: false
  tags: [iscsi, target, verify]

- name: Verify CHAP authentication is required on the SBD target
  ansible.builtin.command:
    cmd: targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1 get attribute authentication
  register: iscsi_target_auth_verify
  changed_when: false
  failed_when: >-
    iscsi_target_auth_verify.rc != 0 or
    'authentication=1' not in iscsi_target_auth_verify.stdout
  check_mode: false
  tags: [iscsi, target, verify]
