---
# Greenfield targetcli wiring from task 2.1 §3. Skipped under --check and when
# the IQN already exists (idempotent on the live Monitoring VM).

- name: Require CHAP credentials before touching the SBD target
  ansible.builtin.assert:
    that:
      - iscsi_target_chap_userid | length > 0
      - iscsi_target_chap_password | length >= 12
    fail_msg: >-
      iscsi_target_chap_userid/iscsi_target_chap_password must be set in
      inventory (same secret as iscsi_initiator_chap_* on both mail nodes).
      Refusing rather than leaving the SBD fencing LUN unauthenticated.
  tags: [iscsi, target, targetcli]

- name: Check whether the SBD target IQN already exists
  ansible.builtin.command:
    cmd: targetcli ls /iscsi/{{ iscsi_target_iqn }}
  register: iscsi_target_iqn_ls
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [iscsi, target, targetcli]

- name: Configure the fileio backstore for the SBD LUN
  ansible.builtin.shell: |
    set -euo pipefail
    targetcli /backstores/fileio create {{ iscsi_target_backstore_name }} {{ iscsi_target_lun_img }}
  args:
    executable: /bin/bash
  when:
    - iscsi_target_iqn_ls.rc != 0
    - not ansible_check_mode
  register: iscsi_target_backstore_create
  failed_when: >-
    iscsi_target_backstore_create.rc != 0 and
    ('exists' not in (iscsi_target_backstore_create.stderr | default('')) | lower) and
    ('exists' not in (iscsi_target_backstore_create.stdout | default('')) | lower)
  tags: [iscsi, target, targetcli]

- name: Create the SBD iSCSI target and map the LUN
  ansible.builtin.shell: |
    set -euo pipefail
    targetcli /iscsi create {{ iscsi_target_iqn }} || true
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/luns create /backstores/fileio/{{ iscsi_target_backstore_name }} || true
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1 set attribute generate_node_acls=1 demo_mode_write_protect=0 authentication=1
    # Ubuntu targetcli often auto-adds 0.0.0.0:3260 on /iscsi create - ignore duplicate.
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/portals create 0.0.0.0 {{ iscsi_target_portal_port }} || true
    targetcli saveconfig
  args:
    executable: /bin/bash
  when:
    - iscsi_target_iqn_ls.rc != 0
    - not ansible_check_mode
  tags: [iscsi, target, targetcli]

# Runs every time (not gated on iqn_ls.rc), so re-running this role against
# the already-existing live target still enforces CHAP - the "create" block
# above only sets it on a brand new target and is skipped once the IQN
# exists. targetcli's `set auth` is idempotent (safe to repeat with the
# same values).
- name: Require CHAP authentication on the SBD target
  ansible.builtin.command:
    cmd: targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1 set attribute authentication=1
  changed_when: true
  when: not ansible_check_mode
  no_log: true
  tags: [iscsi, target, targetcli]

- name: Set the CHAP credentials on the SBD target
  ansible.builtin.command:
    cmd: >-
      targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1 set auth
      userid={{ iscsi_target_chap_userid }} password={{ iscsi_target_chap_password }}
  changed_when: true
  when: not ansible_check_mode
  no_log: true
  tags: [iscsi, target, targetcli]

- name: Save targetcli config after CHAP changes
  ansible.builtin.command:
    cmd: targetcli saveconfig
  changed_when: false
  when: not ansible_check_mode
  tags: [iscsi, target, targetcli]

- name: Note that targetcli is not proven from scratch during a dry-run
  ansible.builtin.debug:
    msg: >-
      Target {{ iscsi_target_iqn }} has not been detected yet. Under --check the
      targetcli steps are skipped (not greenfield proof).
  when:
    - iscsi_target_iqn_ls.rc != 0
    - ansible_check_mode
  tags: [iscsi, target, targetcli]
