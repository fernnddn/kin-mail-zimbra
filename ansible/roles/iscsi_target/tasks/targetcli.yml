---
# Greenfield targetcli wiring from task 2.1 §3. Skipped under --check and when
# the IQN already exists (idempotent on the live Monitoring VM).

- name: Check whether the SBD target IQN already exists
  ansible.builtin.command:
    cmd: targetcli ls /iscsi/{{ iscsi_target_iqn }}
  register: iscsi_target_iqn_ls
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [iscsi, target, targetcli]

- name: Configure the fileio backstore for the SBD LUN
  ansible.builtin.shell: |
    set -euo pipefail
    targetcli /backstores/fileio create {{ iscsi_target_backstore_name }} {{ iscsi_target_lun_img }}
  args:
    executable: /bin/bash
  when:
    - iscsi_target_iqn_ls.rc != 0
    - not ansible_check_mode
  register: iscsi_target_backstore_create
  failed_when: >-
    iscsi_target_backstore_create.rc != 0 and
    ('exists' not in (iscsi_target_backstore_create.stderr | default('')) | lower) and
    ('exists' not in (iscsi_target_backstore_create.stdout | default('')) | lower)
  tags: [iscsi, target, targetcli]

- name: Create the SBD iSCSI target and map the LUN
  ansible.builtin.shell: |
    set -euo pipefail
    targetcli /iscsi create {{ iscsi_target_iqn }}
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/luns create /backstores/fileio/{{ iscsi_target_backstore_name }}
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1 set attribute generate_node_acls=1 demo_mode_write_protect=0 authentication=0
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/portals create 0.0.0.0 {{ iscsi_target_portal_port }}
    targetcli saveconfig
  args:
    executable: /bin/bash
  when:
    - iscsi_target_iqn_ls.rc != 0
    - not ansible_check_mode
  tags: [iscsi, target, targetcli]

- name: Note that targetcli is not proven from scratch during a dry-run
  ansible.builtin.debug:
    msg: >-
      Target {{ iscsi_target_iqn }} has not been detected yet. Under --check the
      targetcli steps are skipped (not greenfield proof).
  when:
    - iscsi_target_iqn_ls.rc != 0
    - ansible_check_mode
  tags: [iscsi, target, targetcli]
