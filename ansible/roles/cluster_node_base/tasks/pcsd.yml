---
# =============================================================================
# MUTATING — new node only (add-host). Do not set check_mode: false.
# Enabling pcsd / setting hacluster password on a live MX would be wrong host;
# this role is intended for mail_new_node inventory group only.
# =============================================================================

- name: Enable and start the pcsd service on the new node
  ansible.builtin.systemd:
    name: "{{ cluster_node_base_pcsd_service }}"
    enabled: true
    state: started
  when: not ansible_check_mode
  tags: [cluster, base, pcsd]

- name: Check the pcsd service (read-only dry-run)
  ansible.builtin.command:
    cmd: systemctl is-active {{ cluster_node_base_pcsd_service }}
  register: cluster_node_base_pcsd_active
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_check_mode
  tags: [cluster, base, pcsd]

- name: Set the hacluster account password for pcs authentication
  ansible.builtin.user:
    name: "{{ cluster_node_base_hacluster_user }}"
    password: "{{ cluster_node_base_hacluster_password | password_hash('sha512') }}"
    update_password: always
  # SAFETY: never check_mode: false — password change must not run in dry-run.
  when:
    - not ansible_check_mode
    - cluster_node_base_hacluster_password | length > 0
    - cluster_node_base_set_hacluster_password | bool
  no_log: true
  tags: [cluster, base, pcsd]

- name: Note that the hacluster password must be set before applying
  ansible.builtin.debug:
    msg: >-
      cluster_node_base_hacluster_password is empty — set it via inventory/--extra-vars
      before a real apply. pcs host auth from the survivor requires it.
  when: cluster_node_base_hacluster_password | length == 0
  tags: [cluster, base, pcsd]
