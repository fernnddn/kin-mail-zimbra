---
# Membership detection. Mutating pcs is never check_mode: false and this
# role never runs pcs cluster destroy / --overwrite.
#
# Exception: Debian/Ubuntu corosync.deb auto-starts a throwaway loopback
# cluster from the package example config (cluster_name debian). That is
# not real membership. detect.yml stops those units and removes the stub
# corosync.conf. It also removes a throwaway Pacemaker cib.xml left by
# that first-start (empty resources, cluster-name is not kin-mail). Nodes
# and status history from the debian loopback cluster are allowed; a CIB
# with resources, constraints, or cluster-name kin-mail is left alone and
# pcs cluster setup is refused (fail closed). The same CIB cleanup runs
# on retry after corosync.conf is already gone so leftover cib.xml cannot
# block pcs cluster setup a second time.
- name: Require exactly two mail_nodes for cluster setup
  ansible.builtin.assert:
    that:
      - groups['mail_nodes'] | length == 2
    fail_msg: >-
      cluster_setup expects exactly two hosts in mail_nodes
      (got {{ groups['mail_nodes'] | length }}).
  run_once: true
  tags: [cluster, setup, detect]

- name: Require ansible_host on every mail node
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host | default('') | length > 0
    fail_msg: >-
      {{ item }} has no ansible_host - pcs cluster setup needs a real LAN IP,
      not a hostname that might resolve to loopback after the HA remap.
  loop: "{{ groups['mail_nodes'] }}"
  run_once: true
  tags: [cluster, setup, detect]

- name: Probe whether Pacemaker is already running
  ansible.builtin.command:
    cmd: pcs status
  register: cluster_setup_pcs_status
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [cluster, setup, detect]

- name: Check for an existing Corosync configuration
  ansible.builtin.stat:
    path: /etc/corosync/corosync.conf
  register: cluster_setup_corosync_conf
  check_mode: false
  tags: [cluster, setup, detect]

- name: Read current Corosync node names (best-effort)
  ansible.builtin.command:
    cmd: pcs status nodes corosync
  register: cluster_setup_nodes_corosync
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [cluster, setup, detect]

- name: Slurp corosync.conf when present
  ansible.builtin.slurp:
    src: /etc/corosync/corosync.conf
  register: cluster_setup_corosync_conf_body
  check_mode: false
  when: cluster_setup_corosync_conf.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Classify a Debian package-default Corosync stub
  ansible.builtin.set_fact:
    cluster_setup_debian_stub: "{{ (cluster_setup_corosync_conf_body.content | b64decode) | kin_is_debian_corosync_stub }}"
    cluster_setup_conf_name: "{{ (cluster_setup_corosync_conf_body.content | b64decode) | kin_parse_corosync_cluster_name }}"
  when: cluster_setup_corosync_conf.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Note a throwaway Debian package-default Corosync stub
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has the Debian/Ubuntu package-default
      Corosync stub (cluster_name debian, loopback-only). That is not a
      real cluster. This role will stop the throwaway service, remove the
      stub corosync.conf, and remove a throwaway Pacemaker cib.xml
      (package first-start, including local node/status history) so pcs
      cluster setup can write a real config.
  when: cluster_setup_debian_stub | bool
  tags: [cluster, setup, detect]

- name: Flag leftover CIB that must not block greenfield pcs cluster setup
  ansible.builtin.set_fact:
    cluster_setup_inspect_leftover_cib: >-
      {{ (cluster_setup_debian_stub | bool)
         or (not (cluster_setup_corosync_conf.stat.exists | default(false))) }}
  tags: [cluster, setup, detect]

- name: Stop and disable the throwaway Debian Corosync stub
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - pacemaker
    - corosync
  when:
    - cluster_setup_debian_stub | bool
    - not ansible_check_mode
  tags: [cluster, setup, detect]

- name: Keep a copy of the Debian stub corosync.conf
  ansible.builtin.copy:
    src: /etc/corosync/corosync.conf
    dest: /etc/corosync/corosync.conf.kin-package-stub
    remote_src: true
    force: true
    mode: "0644"
  when:
    - cluster_setup_debian_stub | bool
    - not ansible_check_mode
    - cluster_setup_corosync_conf.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Remove the Debian stub corosync.conf so pcs cluster setup can write
  ansible.builtin.file:
    path: /etc/corosync/corosync.conf
    state: absent
  when:
    - cluster_setup_debian_stub | bool
    - not ansible_check_mode
  tags: [cluster, setup, detect]

- name: Check for a leftover Pacemaker cib.xml
  ansible.builtin.stat:
    path: /var/lib/pacemaker/cib/cib.xml
  register: cluster_setup_cib_xml
  check_mode: false
  tags: [cluster, setup, detect]

- name: Slurp leftover cib.xml when there is no real Corosync membership
  ansible.builtin.slurp:
    src: /var/lib/pacemaker/cib/cib.xml
  register: cluster_setup_cib_xml_body
  check_mode: false
  when:
    - cluster_setup_inspect_leftover_cib | bool
    - cluster_setup_cib_xml.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Classify a throwaway package-first-start cib.xml
  ansible.builtin.set_fact:
    cluster_setup_throwaway_cib: "{{ (cluster_setup_cib_xml_body.content | b64decode) | kin_is_throwaway_package_cib(cluster_setup_name) }}"
  when:
    - cluster_setup_inspect_leftover_cib | bool
    - cluster_setup_cib_xml.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Refuse leftover real CIB when Corosync is not a formed kin-mail cluster
  ansible.builtin.assert:
    that:
      - cluster_setup_throwaway_cib | bool
    fail_msg: >-
      {{ inventory_hostname }} has /var/lib/pacemaker/cib/cib.xml that is not
      a throwaway Debian/Ubuntu package-first-start CIB (it has resources,
      constraints, or cluster-name {{ cluster_setup_name }}). Refusing pcs
      cluster setup so a real cluster is not overwritten. Inspect the CIB
      or restore corosync.conf; this role never runs pcs cluster destroy.
  when:
    - cluster_setup_inspect_leftover_cib | bool
    - cluster_setup_cib_xml.stat.exists | default(false)
    - not (cluster_setup_throwaway_cib | bool)
  tags: [cluster, setup, detect]

- name: Stop Pacemaker before removing leftover package CIB files
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - pacemaker
    - corosync
  when:
    - cluster_setup_throwaway_cib | bool
    - not ansible_check_mode
  tags: [cluster, setup, detect]

- name: Keep a copy of the throwaway Pacemaker cib.xml
  ansible.builtin.copy:
    src: /var/lib/pacemaker/cib/cib.xml
    dest: /var/lib/pacemaker/cib/cib.xml.kin-package-stub
    remote_src: true
    force: true
    mode: "0600"
  when:
    - cluster_setup_throwaway_cib | bool
    - not ansible_check_mode
    - cluster_setup_cib_xml.stat.exists | default(false)
  tags: [cluster, setup, detect]

- name: Remove throwaway Pacemaker CIB files so pcs cluster setup can write
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/pacemaker/cib/cib.xml
    - /var/lib/pacemaker/cib/cib.xml.sig
    - /var/lib/pacemaker/cib/cib.xml.last
    - /var/lib/pacemaker/cib/cib.xml.diffs
    - /etc/corosync/authkey
  when:
    - cluster_setup_throwaway_cib | bool
    - not ansible_check_mode
  tags: [cluster, setup, detect]

# Re-probe/re-check MUST use distinct register names. A skipped task with
# register: still overwrites the variable with a skip stub that has no .rc
# or .stat; sharing cluster_setup_pcs_status / cluster_setup_corosync_conf
# with the unconditional probes above broke greenfield hosts (no stub, no
# corosync.conf) after pcs cluster destroy.
- name: Re-probe Pacemaker after clearing leftover package files
  ansible.builtin.command:
    cmd: pcs status
  register: cluster_setup_pcs_status_after_stub
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - (cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool)
    - not ansible_check_mode
  tags: [cluster, setup, detect]

- name: Re-check corosync.conf after clearing leftover package files
  ansible.builtin.stat:
    path: /etc/corosync/corosync.conf
  register: cluster_setup_corosync_conf_after_stub
  check_mode: false
  when:
    - (cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool)
    - not ansible_check_mode
  tags: [cluster, setup, detect]

# Pick the live probe when stub/CIB cleanup actually ran; otherwise the
# initial unconditional probe. check_mode + leftover package files: treat
# as not running/configured so dry-run does not claim the throwaway
# package cluster is real membership.
- name: Flag whether this host is already in a running cluster
  ansible.builtin.set_fact:
    cluster_setup_running: >-
      {{ false
         if (
           ((cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool))
           and ansible_check_mode
         )
         else (
           (
             cluster_setup_pcs_status_after_stub.rc
             if (
               ((cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool))
               and not ansible_check_mode
             )
             else cluster_setup_pcs_status.rc
           ) == 0
         ) }}
    cluster_setup_configured: >-
      {{ false
         if (
           ((cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool))
           and ansible_check_mode
         )
         else (
           (
             cluster_setup_corosync_conf_after_stub.stat.exists | default(false)
           )
           if (
             ((cluster_setup_debian_stub | bool) or (cluster_setup_throwaway_cib | bool))
             and not ansible_check_mode
           )
           else (cluster_setup_corosync_conf.stat.exists | default(false))
         ) }}
    cluster_setup_expected_names: "{{ groups['mail_nodes'] }}"
    cluster_setup_formed_this_run: false
  tags: [cluster, setup, detect]

- name: Start the existing kin-mail cluster when Pacemaker is down
  ansible.builtin.command:
    cmd: pcs --request-timeout={{ cluster_setup_pcs_request_timeout }} cluster start
  # SAFETY: never check_mode: false. Never pcs cluster destroy / --overwrite.
  # After mail-fencing SBD_DELAY_START is in place, start waits ~msgwait;
  # pcsd's 60s default times out with 0 bytes received (log-25).
  throttle: 1
  when:
    - cluster_setup_configured | bool
    - not (cluster_setup_running | bool)
    - not (cluster_setup_debian_stub | bool)
    - (cluster_setup_conf_name | default('')) == (cluster_setup_name | default('kin-mail'))
    - not ansible_check_mode
  register: cluster_setup_resume_start
  tags: [cluster, setup, detect]

- name: Re-probe Pacemaker after resuming a stopped kin-mail cluster
  ansible.builtin.command:
    cmd: pcs status
  register: cluster_setup_pcs_status_after_resume
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cluster_setup_configured | bool
    - not (cluster_setup_debian_stub | bool)
    - (cluster_setup_conf_name | default('')) == (cluster_setup_name | default('kin-mail'))
    - not ansible_check_mode
    - cluster_setup_resume_start is not skipped
  tags: [cluster, setup, detect]

- name: Flag Pacemaker running after a successful resume start
  ansible.builtin.set_fact:
    cluster_setup_running: "{{ (cluster_setup_pcs_status_after_resume.rc | default(1) | int) == 0 }}"
  when:
    - cluster_setup_resume_start is not skipped
    - not ansible_check_mode
  tags: [cluster, setup, detect]

- name: Refuse pcs cluster setup when a corosync.conf already exists
  ansible.builtin.assert:
    that:
      - cluster_setup_running | bool
    fail_msg: >-
      /etc/corosync/corosync.conf exists but pcs status is not running on
      {{ inventory_hostname }} (cluster_name={{ cluster_setup_conf_name | default('') }}).
      Refusing pcs cluster setup (would need destroy/overwrite). This role
      auto-starts only when cluster_name is {{ cluster_setup_name }}.
      Inspect the leftover config; this role never runs pcs cluster destroy.
  when:
    - cluster_setup_configured | bool
    - not (cluster_setup_running | bool)
  tags: [cluster, setup, detect]

- name: Read Corosync node names for membership assert
  ansible.builtin.command:
    cmd: pcs status nodes corosync
  register: cluster_setup_nodes_for_assert
  changed_when: false
  failed_when: false
  check_mode: false
  when: cluster_setup_running | bool
  tags: [cluster, setup, detect]

- name: Remember whether any mail node already has a cluster
  ansible.builtin.set_fact:
    cluster_setup_any_running: >-
      {{
        (
          ansible_play_hosts
          | map('extract', hostvars, 'cluster_setup_running')
          | map('bool')
          | select
          | list
          | length
        ) > 0
      }}
    cluster_setup_any_configured: >-
      {{
        (
          ansible_play_hosts
          | map('extract', hostvars, 'cluster_setup_configured')
          | map('bool')
          | select
          | list
          | length
        ) > 0
      }}
    cluster_setup_nodes_blob: >-
      {{
        ansible_play_hosts
        | map('extract', hostvars, 'cluster_setup_nodes_for_assert')
        | selectattr('stdout', 'defined')
        | map(attribute='stdout')
        | select
        | list
        | first
        | default('')
      }}
  tags: [cluster, setup, detect]

- name: Refuse to form a cluster that already has unexpected members
  ansible.builtin.assert:
    that:
      - item in (cluster_setup_nodes_blob | default(''))
    fail_msg: >-
      A Corosync cluster is already running but {{ item }} is not in
      `pcs status nodes corosync`. Refusing to re-run pcs cluster setup
      (that would destroy or split membership). Fix membership by hand.
  loop: "{{ groups['mail_nodes'] }}"
  when: cluster_setup_any_running | bool
  run_once: true
  tags: [cluster, setup, detect]
