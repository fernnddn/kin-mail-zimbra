---
# Greenfield Corosync/Pacemaker bootstrap (pcs cluster setup).
# Name matches HA-RUNBOOK.md. Override in inventory for a customer cluster.
cluster_setup_name: kin-mail
cluster_setup_hacluster_user: "{{ cluster_node_base_hacluster_user | default('hacluster') }}"
cluster_setup_hacluster_password: "{{ cluster_node_base_hacluster_password | default('') }}"
# Fresh cluster only. Fencing playbook later sets stonith-enabled=true.
cluster_setup_stonith_enabled_until_fencing: false
cluster_setup_no_quorum_policy: stop
# Set in detect.yml. True only for the Debian/Ubuntu package-default stub.
cluster_setup_debian_stub: false
# Set in detect.yml when leftover cib.xml is a throwaway package-first-start CIB
# (no resources, cluster-name is not kin-mail). Nodes/status history from the
# debian loopback cluster are allowed.
cluster_setup_throwaway_cib: false
# True when leftover cib.xml must be classified (debian stub, or no corosync.conf).
cluster_setup_inspect_leftover_cib: false
# cluster_name from the slurped corosync.conf (empty when absent or unparseable).
cluster_setup_conf_name: ""
# pcsd default request timeout is 60s. After SBD_DELAY_START is configured,
# cluster start waits ~msgwait and systemd TimeoutStartSec (180s). Retry of a
# stopped kin-mail pair must outlive that or pcsd returns 0 bytes received.
cluster_setup_pcs_request_timeout: 300

# Corosync totem timing, in milliseconds.
#
# The stock token is 1000ms: a node that goes quiet for about 1.2 seconds is
# declared lost, and losing a node means fencing it. Replication, the iSCSI
# session to the SBD LUN, and Zimbra all share one NIC with corosync here, so
# a second of delay is not an outage, it is a busy link. The Phase 7 2-host
# run fenced and rebooted on exactly that.
#
# 10s is the usual figure for virtualised nodes. It has to stay comfortably
# under SBD_WATCHDOG_TIMEOUT (35s) so the cluster still notices a dead node
# before that node's own watchdog fires: token + consensus = 22s here.
# Raising it slows deliberate failover by a few seconds and nothing else -
# fencing (msgwait 70s) and the Zimbra start dominate that path anyway.
cluster_setup_token_ms: 10000
cluster_setup_consensus_ms: 12000
