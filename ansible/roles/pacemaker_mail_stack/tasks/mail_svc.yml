---
# =============================================================================
# MUTATING pcs COMMANDS - kin-mail-svc group (PRODUCTION)
# Same rules as drbd_clone.yml: never check_mode: false on create/group add.
# =============================================================================

- name: Require a VIP that is not a mail-node address
  ansible.builtin.assert:
    that:
      - pacemaker_mail_stack_vip_ip | length > 0
      - pacemaker_mail_stack_vip_ip != (hostvars[inventory_hostname].ansible_host | default(''))
      - pacemaker_mail_stack_vip_ip not in (groups['mail_nodes'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
    fail_msg: >-
      pacemaker_mail_stack_vip_ip={{ pacemaker_mail_stack_vip_ip | default('(empty)') }}
      is unset or collides with a mail-node ansible_host. Set the VIP explicitly
      in inventory - never reuse a node NIC address as the floating IP.
  run_once: true
  tags: [pacemaker, stack, group]

- name: Check whether the kin-fs filesystem resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_fs }}
  register: pacemaker_mail_stack_fs_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the kin-fs filesystem resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_fs }} ocf:heartbeat:Filesystem
      device={{ pacemaker_mail_stack_fs_device }}
      directory={{ pacemaker_mail_stack_fs_directory }}
      fstype={{ pacemaker_mail_stack_fs_fstype }}
      options={{ pacemaker_mail_stack_fs_options }}
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false.
  # --disabled: avoid starting the group on a Secondary before colocation exists.
  run_once: true
  when:
    - pacemaker_mail_stack_fs_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Check whether the kin-zimbra Zimbra resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_zimbra }}
  register: pacemaker_mail_stack_zimbra_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the Zimbra ocf:kin:zimbra resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_zimbra }} ocf:kin:zimbra
      op start timeout=600s
      op stop timeout=300s
      op monitor interval=30s timeout=60s
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false - creating this can start Zimbra on a node.
  run_once: true
  when:
    - pacemaker_mail_stack_zimbra_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Check whether the kin-vip VIP resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_vip }}
  register: pacemaker_mail_stack_vip_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the kin-vip VIP resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_vip }} ocf:heartbeat:IPaddr2
      ip={{ pacemaker_mail_stack_vip_ip }}
      cidr_netmask={{ pacemaker_mail_stack_vip_cidr }}
      {{ ('nic=' ~ pacemaker_mail_stack_vip_nic) if (pacemaker_mail_stack_vip_nic | length > 0) else '' }}
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false - would announce VIP on the network.
  run_once: true
  when:
    - pacemaker_mail_stack_vip_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Note that service group creation is skipped during a dry-run or already exists
  ansible.builtin.debug:
    msg: >-
      Group {{ pacemaker_mail_stack_group }} (fs/zimbra/vip) already exists or this is
      --check mode: pcs resource create was NOT executed against the live CIB.
  when: >-
    ansible_check_mode
    or (pacemaker_mail_stack_fs_cfg.rc == 0
        and pacemaker_mail_stack_zimbra_cfg.rc == 0
        and pacemaker_mail_stack_vip_cfg.rc == 0)
  run_once: true
  tags: [pacemaker, stack, group]
