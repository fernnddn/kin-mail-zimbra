---
# =============================================================================
# MUTATING pcs COMMANDS - kin-mail-svc group (PRODUCTION)
# Same rules as drbd_clone.yml: never check_mode: false on create/group add.
# =============================================================================

- name: Require a VIP that is not a mail-node or qnetd address
  ansible.builtin.assert:
    that:
      - pacemaker_mail_stack_vip_ip | length > 0
      - pacemaker_mail_stack_vip_ip != (hostvars[inventory_hostname].ansible_host | default(''))
      - pacemaker_mail_stack_vip_ip not in (groups['mail_nodes'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
      - pacemaker_mail_stack_vip_ip != (corosync_qdevice_qnetd_ip | default(''))
      - pacemaker_mail_stack_vip_ip not in (groups['monitoring'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
      - (pacemaker_mail_stack_vip_cidr | string | length > 0)
      - (pacemaker_mail_stack_vip_cidr | int) >= 8
      - (pacemaker_mail_stack_vip_cidr | int) <= 30
    fail_msg: >-
      pacemaker_mail_stack_vip_ip={{ pacemaker_mail_stack_vip_ip | default('(empty)') }}
      is unset, has an invalid cidr_netmask, or collides with a mail-node /
      monitoring / qnetd ansible_host. Set the VIP explicitly in inventory -
      never reuse a node NIC or witness address as the floating IP.
  run_once: true
  tags: [pacemaker, stack, group]

- name: Refuse prefer-location scores that beat Promoted stickiness
  ansible.builtin.assert:
    that:
      - not (pacemaker_mail_stack_prefer_enabled | bool)
        or (
          (pacemaker_mail_stack_prefer_node | length > 0)
          and ((pacemaker_mail_stack_prefer_score | int) < (pacemaker_mail_stack_clone_stickiness | int))
        )
    fail_msg: >-
      prefer_enabled requires prefer_node and prefer_score
      ({{ pacemaker_mail_stack_prefer_score }}) strictly less than
      clone stickiness ({{ pacemaker_mail_stack_clone_stickiness }}).
      Equal/higher scores recreate automatic failback (controlled failover test).
  run_once: true
  tags: [pacemaker, stack, group, drbd]

- name: Check whether the kin-fs filesystem resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_fs }}
  register: pacemaker_mail_stack_fs_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the kin-fs filesystem resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_fs }} ocf:heartbeat:Filesystem
      device={{ pacemaker_mail_stack_fs_device }}
      directory={{ pacemaker_mail_stack_fs_directory }}
      fstype={{ pacemaker_mail_stack_fs_fstype }}
      options={{ pacemaker_mail_stack_fs_options }}
      force_unmount={{ pacemaker_mail_stack_fs_force_unmount }}
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false.
  # --disabled: avoid starting the group on a Secondary before colocation exists.
  run_once: true
  when:
    - pacemaker_mail_stack_fs_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

# Set on a cluster built before this was pinned. Unmounting is this resource's
# job, and whether it is willing to clear what is holding the mount decides
# whether a busy /opt/zimbra is a two-second delay or a fenced node.
- name: Pin force_unmount on an existing kin-fs that does not set it
  ansible.builtin.command:
    cmd: >-
      pcs resource update {{ pacemaker_mail_stack_fs }}
      force_unmount={{ pacemaker_mail_stack_fs_force_unmount }}
  run_once: true
  when:
    - not ansible_check_mode
    - pacemaker_mail_stack_fs_cfg.rc == 0
    - >-
      ('force_unmount=' ~ pacemaker_mail_stack_fs_force_unmount)
      not in pacemaker_mail_stack_fs_cfg.stdout
  changed_when: true
  tags: [pacemaker, stack, group]

- name: Check whether the kin-zimbra Zimbra resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_zimbra }}
  register: pacemaker_mail_stack_zimbra_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the Zimbra ocf:kin:zimbra resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_zimbra }} ocf:kin:zimbra
      op start timeout=600s
      op stop timeout=300s
      op monitor interval=30s timeout=60s
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false - creating this can start Zimbra on a node.
  run_once: true
  when:
    - pacemaker_mail_stack_zimbra_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Check whether the kin-vip VIP resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_vip }}
  register: pacemaker_mail_stack_vip_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, group]

- name: Create the kin-vip VIP resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_vip }} ocf:heartbeat:IPaddr2
      ip={{ pacemaker_mail_stack_vip_ip }}
      cidr_netmask={{ pacemaker_mail_stack_vip_cidr }}
      {{ ('nic=' ~ pacemaker_mail_stack_vip_nic) if (pacemaker_mail_stack_vip_nic | length > 0) else '' }}
      op monitor interval=10s timeout=20s
      meta migration-threshold=3 failure-timeout=120s
      --group {{ pacemaker_mail_stack_group }}
      --disabled
  # SAFETY: never check_mode: false - would announce VIP on the network.
  run_once: true
  when:
    - pacemaker_mail_stack_vip_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Decide whether kin-vip CIB attrs drifted from inventory
  ansible.builtin.set_fact:
    pacemaker_mail_stack_vip_drift: >-
      {{
        pacemaker_mail_stack_vip_cfg.rc == 0
        and (
          ('ip=' ~ pacemaker_mail_stack_vip_ip) not in pacemaker_mail_stack_vip_cfg.stdout
          or ('cidr_netmask=' ~ (pacemaker_mail_stack_vip_cidr | string)) not in pacemaker_mail_stack_vip_cfg.stdout
          or (
            (pacemaker_mail_stack_vip_nic | length > 0)
            and (('nic=' ~ pacemaker_mail_stack_vip_nic) not in pacemaker_mail_stack_vip_cfg.stdout)
          )
          or (
            (pacemaker_mail_stack_vip_nic | length == 0)
            and ('nic=' in pacemaker_mail_stack_vip_cfg.stdout)
          )
        )
      }}
  run_once: true
  tags: [pacemaker, stack, group]

- name: Check whether kin-vip is currently Started
  ansible.builtin.shell: |
    set -euo pipefail
    crm_mon -1 -r 2>/dev/null | grep -E 'kin-vip' | grep -E 'Started' >/dev/null
  args:
    executable: /bin/bash
  register: pacemaker_mail_stack_vip_started
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  when:
    - pacemaker_mail_stack_vip_drift | bool
    - not ansible_check_mode
  tags: [pacemaker, stack, group]

- name: Refuse VIP attr update while kin-vip is Started
  ansible.builtin.assert:
    that:
      - pacemaker_mail_stack_vip_started.rc != 0
    fail_msg: >-
      kin-vip CIB attrs differ from inventory but the VIP is Started.
      Updating IPaddr2 in place stop/starts the address (brief outage / dual
      announce risk). Disable kin-mail-svc or enter maintenance, then re-run.
  run_once: true
  when:
    - pacemaker_mail_stack_vip_drift | bool
    - not ansible_check_mode
    - pacemaker_mail_stack_vip_started is defined
  tags: [pacemaker, stack, group]

- name: Update kin-vip when inventory IP/cidr/nic drifted and VIP is not Started
  ansible.builtin.command:
    cmd: >-
      pcs resource update {{ pacemaker_mail_stack_vip }}
      ip={{ pacemaker_mail_stack_vip_ip }}
      cidr_netmask={{ pacemaker_mail_stack_vip_cidr }}
      {% if pacemaker_mail_stack_vip_nic | length > 0 %}nic={{ pacemaker_mail_stack_vip_nic }}
      {% elif 'nic=' in pacemaker_mail_stack_vip_cfg.stdout %}--delete=nic{% endif %}
  run_once: true
  when:
    - pacemaker_mail_stack_vip_drift | bool
    - not ansible_check_mode
    - pacemaker_mail_stack_vip_started is defined
    - pacemaker_mail_stack_vip_started.rc != 0
  tags: [pacemaker, stack, group]

- name: Note that service group creation is skipped during a dry-run or already exists
  ansible.builtin.debug:
    msg: >-
      Group {{ pacemaker_mail_stack_group }} (fs/zimbra/vip) already exists or this is
      --check mode: pcs resource create was NOT executed against the live CIB.
  when: >-
    ansible_check_mode
    or (pacemaker_mail_stack_fs_cfg.rc == 0
        and pacemaker_mail_stack_zimbra_cfg.rc == 0
        and pacemaker_mail_stack_vip_cfg.rc == 0)
  run_once: true
  tags: [pacemaker, stack, group]
