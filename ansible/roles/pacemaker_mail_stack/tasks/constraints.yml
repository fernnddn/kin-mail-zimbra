---
# =============================================================================
# MUTATING pcs CONSTRAINTS — LIVE CLUSTER
# Colocation/order bind the app group to Promoted DRBD. Never check_mode: false.
# =============================================================================

- name: Check the existing colocation and order constraints
  ansible.builtin.command:
    cmd: pcs constraint
  register: pacemaker_mail_stack_constraints
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, constraints]

- name: Add the service group colocation with the DRBD Master
  ansible.builtin.command:
    cmd: >-
      pcs constraint colocation add {{ pacemaker_mail_stack_group }}
      with {{ pacemaker_mail_stack_drbd_clone }} INFINITY
      with-rsc-role=Promoted
  # SAFETY: never check_mode: false.
  run_once: true
  when:
    - not ansible_check_mode
    - pacemaker_mail_stack_group not in pacemaker_mail_stack_constraints.stdout
      or 'with Promoted' not in pacemaker_mail_stack_constraints.stdout
  tags: [pacemaker, stack, constraints]

- name: Add the order to promote DRBD then start the service group
  ansible.builtin.command:
    cmd: >-
      pcs constraint order promote {{ pacemaker_mail_stack_drbd_clone }}
      then start {{ pacemaker_mail_stack_group }}
  # SAFETY: never check_mode: false.
  run_once: true
  when:
    - not ansible_check_mode
    - >-
      ('promote resource' not in pacemaker_mail_stack_constraints.stdout)
      or (pacemaker_mail_stack_group not in pacemaker_mail_stack_constraints.stdout)
  tags: [pacemaker, stack, constraints]

- name: Note that constraints are skipped during a dry-run or already exist
  ansible.builtin.debug:
    msg: >-
      The colocation/order constraints already exist or this is --check mode: pcs
      constraint add was NOT executed. The schema needs with-rsc-role=Promoted
      (not just role=) as in task 2.7.
  when: ansible_check_mode
  run_once: true
  tags: [pacemaker, stack, constraints]
