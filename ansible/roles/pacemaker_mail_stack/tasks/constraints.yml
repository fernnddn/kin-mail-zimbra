---
# =============================================================================
# MUTATING pcs CONSTRAINTS - LIVE CLUSTER
# Colocation/order bind the app group to Promoted DRBD. Never check_mode: false.
# =============================================================================

- name: Check the existing colocation and order constraints
  ansible.builtin.command:
    cmd: pcs constraint
  register: pacemaker_mail_stack_constraints
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, constraints]

- name: Add the service group colocation with the DRBD Master
  ansible.builtin.command:
    cmd: >-
      pcs constraint colocation add {{ pacemaker_mail_stack_group }}
      with {{ pacemaker_mail_stack_drbd_clone }} INFINITY
      with-rsc-role=Promoted
  # SAFETY: never check_mode: false.
  run_once: true
  when:
    - not ansible_check_mode
    - not (pacemaker_mail_stack_constraints.stdout | kin_pcs_has_promoted_colocation(pacemaker_mail_stack_group, pacemaker_mail_stack_drbd_clone))
  tags: [pacemaker, stack, constraints]

- name: Add the order to promote DRBD then start the service group
  ansible.builtin.command:
    cmd: >-
      pcs constraint order promote {{ pacemaker_mail_stack_drbd_clone }}
      then start {{ pacemaker_mail_stack_group }}
  # SAFETY: never check_mode: false.
  run_once: true
  when:
    - not ansible_check_mode
    - not (pacemaker_mail_stack_constraints.stdout | kin_pcs_has_promote_then_start(pacemaker_mail_stack_drbd_clone, pacemaker_mail_stack_group))
  tags: [pacemaker, stack, constraints]

# Group members are created --disabled (meta target-role=Stopped on each
# primitive) so they do not start on a Secondary before colocation exists.
# pcs resource enable <group> only clears the group wrapper; the three
# primitives stay Stopped (disabled) - that is the log-26 / live lab state.
# Enable the primitives themselves after constraints are in place - but only
# when they are still disabled, so a later stack re-run does not force-enable
# resources an operator stopped for maintenance.
- name: Detect disabled kin-mail-svc primitives
  ansible.builtin.command:
    cmd: pcs resource config {{ item }}
  register: pacemaker_mail_stack_enable_probe
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  loop:
    - "{{ pacemaker_mail_stack_fs }}"
    - "{{ pacemaker_mail_stack_zimbra }}"
    - "{{ pacemaker_mail_stack_vip }}"
    - "{{ pacemaker_mail_stack_group }}"
  tags: [pacemaker, stack, constraints]

- name: Enable the kin-mail-svc primitives after constraints
  ansible.builtin.command:
    cmd: >-
      pcs resource enable
      {{ pacemaker_mail_stack_fs }}
      {{ pacemaker_mail_stack_zimbra }}
      {{ pacemaker_mail_stack_vip }}
      {{ pacemaker_mail_stack_group }}
  run_once: true
  when:
    - not ansible_check_mode
    - >-
      pacemaker_mail_stack_enable_probe.results
      | selectattr('stdout', 'search', 'target-role[=:][[:space:]]*Stopped')
      | list
      | length > 0
  changed_when: false
  tags: [pacemaker, stack, constraints]

# pcs resource enable returns before IPaddr2/Filesystem/Zimbra are Started.
# The previous verify only checked that resource names appear in pcs status,
# so HA UI could show 12/12 while kin-vip was Stopped (wrong nic) or Zimbra
# was still starting (OCF start timeout is 600s).
- name: Wait until kin-fs, kin-vip, and kin-zimbra are Started
  ansible.builtin.command:
    cmd: pcs status
  register: pacemaker_mail_stack_started
  until: >-
    pacemaker_mail_stack_started.rc == 0
    and (pacemaker_mail_stack_started.stdout is search('kin-fs[^\n]*Started'))
    and (pacemaker_mail_stack_started.stdout is search('kin-vip[^\n]*Started'))
    and (pacemaker_mail_stack_started.stdout is search('kin-zimbra[^\n]*Started'))
    and ('Promoted' in pacemaker_mail_stack_started.stdout)
  retries: 90
  delay: 10
  changed_when: false
  check_mode: false
  run_once: true
  when: not ansible_check_mode
  tags: [pacemaker, stack, constraints]

- name: Note that constraints are skipped during a dry-run or already exist
  ansible.builtin.debug:
    msg: >-
      The colocation/order constraints already exist or this is --check mode: pcs
      constraint add was NOT executed. The schema needs with-rsc-role=Promoted
      (not just role=) as in task 2.7.
  when: ansible_check_mode
  run_once: true
  tags: [pacemaker, stack, constraints]
