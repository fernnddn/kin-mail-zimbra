---
# =============================================================================
# MUTATING pcs COMMANDS - LIVE CLUSTER kin-mail (PRODUCTION MX)
# =============================================================================
# Host A/B currently run the full production stack. Under ansible-playbook
# --check these tasks must remain PURE dry-run:
#
#   * Do NOT set check_mode: false on pcs resource create / constraint /
#     property / group mutations.
#   * Gate with `when: not ansible_check_mode` so --check never executes them.
#   * Idempotency: probe with read-only `pcs ... config` first; skip create if
#     the resource already exists (same pattern as drbd_resource activate.yml).
#
# ONLY verify.yml (and read-only existence probes) may use check_mode: false.
# Adding check_mode: false to create/promote/constraint tasks would alter the
# live CIB and can bounce Zimbra / VIP / DRBD promotion. Do not "fix" dry-run.
# =============================================================================

- name: Check whether the promotable DRBD resource already exists
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_drbd_ra }}
  register: pacemaker_mail_stack_drbd_cfg
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, drbd]

- name: Create the kin-drbd promotable DRBD resource
  ansible.builtin.command:
    cmd: >-
      pcs resource create {{ pacemaker_mail_stack_drbd_ra }} ocf:linbit:drbd
      drbd_resource={{ pacemaker_mail_stack_drbd_resource_name }}
      op monitor interval=29s role=Promoted timeout=20s
      op monitor interval=31s role=Unpromoted timeout=20s
      promotable promoted-max=1 promoted-node-max=1
      clone-max=2 clone-node-max=1 notify=true
      meta resource-stickiness={{ pacemaker_mail_stack_clone_stickiness }}
      promoted-resource-stickiness={{ pacemaker_mail_stack_clone_stickiness }}
  # SAFETY: never check_mode: false - create must not run during --check.
  run_once: true
  when:
    - pacemaker_mail_stack_drbd_cfg.rc != 0
    - not ansible_check_mode
  tags: [pacemaker, stack, drbd]

- name: List location constraints with ids
  ansible.builtin.command:
    cmd: pcs constraint location --full
  register: pacemaker_mail_stack_location
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, drbd]

- name: Extract location constraint ids that pin the DRBD clone to a node
  ansible.builtin.set_fact:
    pacemaker_mail_stack_prefer_ids: "{{ pacemaker_mail_stack_location.stdout_lines | select('search', pacemaker_mail_stack_drbd_clone) | select('search', 'prefers node') | map('regex_replace', '.*\\(id: ([^)]+)\\).*', '\\1') | list }}"
  run_once: true
  tags: [pacemaker, stack, drbd]

- name: Remove DRBD clone node-location preferences
  ansible.builtin.command:
    cmd: pcs constraint location remove {{ item }}
  # SAFETY: never check_mode: false.
  loop: "{{ pacemaker_mail_stack_prefer_ids }}"
  run_once: true
  when:
    - not ansible_check_mode
    - not pacemaker_mail_stack_prefer_enabled
    - item | length > 0
  tags: [pacemaker, stack, drbd]

- name: Add the optional Master location preference
  ansible.builtin.command:
    cmd: >-
      pcs constraint location {{ pacemaker_mail_stack_drbd_clone }}
      prefers {{ pacemaker_mail_stack_prefer_node }}={{ pacemaker_mail_stack_prefer_score }}
  # SAFETY: never check_mode: false - constraint add must not run during --check.
  run_once: true
  when:
    - not ansible_check_mode
    - pacemaker_mail_stack_prefer_enabled | bool
    - pacemaker_mail_stack_prefer_node | length > 0
    - >-
      not (
        pacemaker_mail_stack_prefer_node in pacemaker_mail_stack_location.stdout
        and (pacemaker_mail_stack_prefer_score | string) in pacemaker_mail_stack_location.stdout
      )
  tags: [pacemaker, stack, drbd]

- name: Read the DRBD clone meta for stickiness
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_drbd_clone }}
  register: pacemaker_mail_stack_clone_meta
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, drbd]

- name: Set Promoted stickiness so a fence survivor is not auto-failed-back
  ansible.builtin.command:
    cmd: >-
      pcs resource meta {{ pacemaker_mail_stack_drbd_clone }}
      resource-stickiness={{ pacemaker_mail_stack_clone_stickiness }}
      promoted-resource-stickiness={{ pacemaker_mail_stack_clone_stickiness }}
  # SAFETY: never check_mode: false.
  run_once: true
  when:
    - not ansible_check_mode
    - pacemaker_mail_stack_clone_meta.rc == 0
    - >-
      (
        ('resource-stickiness=' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_clone_meta.stdout
        and ('resource-stickiness: ' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_clone_meta.stdout
      )
      or (
        ('promoted-resource-stickiness=' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_clone_meta.stdout
        and ('promoted-resource-stickiness: ' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_clone_meta.stdout
      )
  tags: [pacemaker, stack, drbd]

- name: Note that DRBD clone creation is skipped during a dry-run or already exists
  ansible.builtin.debug:
    msg: >-
      Resource {{ pacemaker_mail_stack_drbd_ra }} already exists or this is --check mode:
      pcs resource create / location prefers was NOT executed against the live CIB.
  when: ansible_check_mode or pacemaker_mail_stack_drbd_cfg.rc == 0
  run_once: true
  tags: [pacemaker, stack, drbd]
