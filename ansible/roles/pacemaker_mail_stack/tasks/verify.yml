---
# Read-only probes against the live CIB / assert helper.
# check_mode: false is intentional and LIMITED to status/constraint queries —
# never extend that to pcs resource create / constraint add / promote.

- name: Verify the Pacemaker cluster status
  ansible.builtin.command:
    cmd: pcs status
  register: pacemaker_mail_stack_status
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_status.rc != 0
    or (pacemaker_mail_stack_drbd_clone not in pacemaker_mail_stack_status.stdout)
    or (pacemaker_mail_stack_group not in pacemaker_mail_stack_status.stdout)
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, verify]

- name: Verify the DRBD clone is in promotable mode
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_drbd_clone }}
  register: pacemaker_mail_stack_clone_cfg
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_clone_cfg.rc != 0
    or ('promoted-max=1' not in pacemaker_mail_stack_clone_cfg.stdout
        and 'promoted-max:1' not in pacemaker_mail_stack_clone_cfg.stdout)
    or ('notify=true' not in pacemaker_mail_stack_clone_cfg.stdout
        and 'notify:true' not in pacemaker_mail_stack_clone_cfg.stdout
        and 'notify=true' not in pacemaker_mail_stack_clone_cfg.stdout | replace(' ', ''))
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, verify]

- name: Verify DRBD clone location is not pinned to a preferred node
  ansible.builtin.command:
    cmd: pcs constraint location
  register: pacemaker_mail_stack_loc_verify
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_loc_verify.rc != 0
    or (
      not (pacemaker_mail_stack_prefer_enabled | bool)
      and pacemaker_mail_stack_drbd_clone in pacemaker_mail_stack_loc_verify.stdout
      and 'prefers' in pacemaker_mail_stack_loc_verify.stdout
    )
    or (
      (pacemaker_mail_stack_prefer_enabled | bool)
      and (
        pacemaker_mail_stack_prefer_node not in pacemaker_mail_stack_loc_verify.stdout
        or ((pacemaker_mail_stack_prefer_score | string) not in pacemaker_mail_stack_loc_verify.stdout)
      )
    )
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, verify]

- name: Verify Promoted stickiness on the DRBD clone
  ansible.builtin.command:
    cmd: pcs resource config {{ pacemaker_mail_stack_drbd_clone }}
  register: pacemaker_mail_stack_stick_verify
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_stick_verify.rc != 0
    or (('resource-stickiness=' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_stick_verify.stdout
        and ('resource-stickiness: ' ~ pacemaker_mail_stack_clone_stickiness)
        not in pacemaker_mail_stack_stick_verify.stdout)
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, verify]

- name: Verify the group colocation and order with the DRBD Master
  ansible.builtin.command:
    cmd: pcs constraint
  register: pacemaker_mail_stack_cstr_verify
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_cstr_verify.rc != 0
    or (pacemaker_mail_stack_group not in pacemaker_mail_stack_cstr_verify.stdout)
    or ('Promoted' not in pacemaker_mail_stack_cstr_verify.stdout)
    or ('promote' not in (pacemaker_mail_stack_cstr_verify.stdout | lower))
  check_mode: false
  run_once: true
  tags: [pacemaker, stack, verify]

- name: Check for the dual-primary assert script
  ansible.builtin.stat:
    path: "{{ pacemaker_agents_assert_path | default('/usr/local/sbin/kin-assert-no-dual-primary.sh') }}"
  register: pacemaker_mail_stack_assert_stat
  check_mode: false
  tags: [pacemaker, stack, verify]

- name: Verify the dual-primary assert returns OK
  ansible.builtin.command:
    cmd: "{{ pacemaker_agents_assert_path | default('/usr/local/sbin/kin-assert-no-dual-primary.sh') }}"
  register: pacemaker_mail_stack_assert
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_assert.rc != 0
    or ('NO_DUAL_PRIMARY_OK' not in pacemaker_mail_stack_assert.stdout)
  check_mode: false
  when: pacemaker_mail_stack_assert_stat.stat.exists
  tags: [pacemaker, stack, verify]

- name: Note that the assert script is not present on this host
  ansible.builtin.debug:
    msg: >-
      {{ pacemaker_agents_assert_path | default('/usr/local/sbin/kin-assert-no-dual-primary.sh') }}
      does not exist on {{ inventory_hostname }} yet — role pacemaker_agents will
      deploy it on apply; the dry-run only reports the gap (visible on lab Host B today).
  when: not pacemaker_mail_stack_assert_stat.stat.exists
  tags: [pacemaker, stack, verify]

- name: Note the Pacemaker dry-run proof limits
  ansible.builtin.debug:
    msg: >-
      The dry-run verifies the live CIB (status/constraints/LDAP on the Primary).
      pcs resource create / constraint add / zmlocalconfig -e are NOT executed.
      Controlled promote/ban moves from task 2.7 are not automated in this slice.
  run_once: true
  tags: [pacemaker, stack, verify]
