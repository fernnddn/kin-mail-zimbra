---
# Active-passive: mailboxd, nginx, and memcached always run together on the
# Promoted node. zmproxyconfgen resolves zimbraServiceHostname via getaddrinfo
# and bakes that IP into nginx lookup/memcached; nginx also resolves the
# hostname at request time for web upstreams / zmauth. Mapping the shared
# identity to 127.0.0.1 makes whichever node is Promoted talk to itself.
#
# Do not change zimbraServiceHostname in LDAP — nginx server_name and account
# zimbraMailHost use that FQDN. Corosync ring0_addr must already be IPs
# (corosync_addrs.yml) before this remap.

- name: Remove LAN-IP mappings of the Zimbra service hostname
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '^(?!127\.0\.0\.1)[0-9.]+\s+{{ pacemaker_mail_stack_zimbra_service_hostname | regex_escape }}(\s+.*)?\n'
    replace: ''
  tags: [pacemaker, stack, hosts]

- name: Map the Zimbra service hostname to loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: >-
      127.0.0.1       {{ pacemaker_mail_stack_zimbra_service_hostname }}
      {{ pacemaker_mail_stack_zimbra_service_shortname }}
    insertafter: '^127\.0\.0\.1\s+localhost'
  tags: [pacemaker, stack, hosts]

- name: Check for the KIN dnsmasq split-horizon file
  ansible.builtin.stat:
    path: "{{ pacemaker_mail_stack_dnsmasq_conf }}"
  register: pacemaker_mail_stack_dnsmasq_stat
  check_mode: false
  tags: [pacemaker, stack, hosts]

- name: Pin the Zimbra service hostname to loopback in dnsmasq
  ansible.builtin.lineinfile:
    path: "{{ pacemaker_mail_stack_dnsmasq_conf }}"
    regexp: '^address=/{{ pacemaker_mail_stack_zimbra_service_hostname | regex_escape }}/'
    line: 'address=/{{ pacemaker_mail_stack_zimbra_service_hostname }}/127.0.0.1'
  register: pacemaker_mail_stack_dnsmasq_line
  when: pacemaker_mail_stack_dnsmasq_stat.stat.exists
  tags: [pacemaker, stack, hosts]

- name: Reload dnsmasq after the service-hostname pin
  ansible.builtin.service:
    name: dnsmasq
    state: reloaded
  when:
    - not ansible_check_mode
    - pacemaker_mail_stack_dnsmasq_stat.stat.exists
    - pacemaker_mail_stack_dnsmasq_line is changed
  tags: [pacemaker, stack, hosts]

- name: Verify the Zimbra service hostname resolves to loopback
  ansible.builtin.command:
    cmd: getent hosts {{ pacemaker_mail_stack_zimbra_service_hostname }}
  register: pacemaker_mail_stack_getent
  changed_when: false
  failed_when: >-
    pacemaker_mail_stack_getent.rc != 0
    or (not pacemaker_mail_stack_getent.stdout.startswith('127.0.0.1'))
  check_mode: false
  tags: [pacemaker, stack, hosts]
