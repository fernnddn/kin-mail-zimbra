---
# Final wiring from Pacemaker mail-stack stage Stages A-C (production cluster values).
pacemaker_mail_stack_drbd_resource_name: kin-zimbra
pacemaker_mail_stack_drbd_ra: kin-drbd
pacemaker_mail_stack_drbd_clone: kin-drbd-clone
pacemaker_mail_stack_group: kin-mail-svc
pacemaker_mail_stack_fs: kin-fs
pacemaker_mail_stack_zimbra: kin-zimbra
pacemaker_mail_stack_vip: kin-vip
pacemaker_mail_stack_fs_device: /dev/drbd0
pacemaker_mail_stack_fs_directory: /opt/zimbra
pacemaker_mail_stack_fs_fstype: ext4
pacemaker_mail_stack_fs_options: noatime
# Must be set in inventory. Empty on purpose: never default a VIP to a node
# address (that would collide with the real NIC on that host).
pacemaker_mail_stack_vip_ip: ""
pacemaker_mail_stack_vip_cidr: "24"
# Empty: omit nic= and let IPaddr2 pick the iface for the VIP subnet on
# whichever node is Promoted. Never default to a site-specific NIC name -
# that silently creates a VIP that cannot start when interfaces differ, and
# pinning nic= to node A's NET_IFACE breaks failover if node B differs.
pacemaker_mail_stack_vip_nic: ""
# After a fence the survivor must stay Promoted; a node location score
# (prefer A=50) caused automatic failback in controlled failover tests. Leave
# disabled unless an operator explicitly pins the Master to one host.
# prefer_node must be set in inventory when prefer_enabled is true.
pacemaker_mail_stack_prefer_node: ""
pacemaker_mail_stack_prefer_score: 50
pacemaker_mail_stack_prefer_enabled: false
pacemaker_mail_stack_clone_stickiness: 1000
# Shared Zimbra server identity (LDAP cn / zimbraServiceHostname). Active-passive
# HA remaps this name to 127.0.0.1 on every mail node so nginx/memcached/zmlookup
# talk to the co-located instance. Corosync ring0_addr must be IPs first.
pacemaker_mail_stack_zimbra_service_hostname: mail.example.test
pacemaker_mail_stack_zimbra_service_shortname: mail
pacemaker_mail_stack_memcached_client_server: 127.0.0.1:11211
pacemaker_mail_stack_dnsmasq_conf: /etc/dnsmasq.d/kin-mail.conf
# LDAP bind for HA (shared store on DRBD). Localhost so each Promoted node
# talks to its co-located slapd.
pacemaker_mail_stack_ldap_url: ldap://127.0.0.1:389
pacemaker_mail_stack_ldap_keys:
  - ldap_bind_url
  - ldap_url
  - ldap_master_url
pacemaker_mail_stack_zimbra_require_interprocess_security: "0"
