---
- name: Prepare the sbd.service drop-in directory
  ansible.builtin.file:
    path: "{{ sbd_stonith_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Deploy the kin-softdog ordering drop-in for SBD
  ansible.builtin.template:
    src: kin-ordering.conf.j2
    dest: "{{ sbd_stonith_dropin_dir }}/kin-ordering.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd after sbd changes
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Deploy the SBD_DELAY_START TimeoutStartSec drop-in
  ansible.builtin.template:
    src: kin-delay-start.conf.j2
    dest: "{{ sbd_stonith_dropin_dir }}/kin-delay-start.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd after sbd changes
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Check the SBD ordering drop-in exists (dry-run)
  ansible.builtin.stat:
    path: "{{ sbd_stonith_dropin_dir }}/kin-ordering.conf"
  register: sbd_stonith_ordering_stat
  failed_when: not sbd_stonith_ordering_stat.stat.exists
  check_mode: false
  tags: [sbd, stonith, dropins]

- name: Check the SBD delay-start drop-in exists (dry-run)
  ansible.builtin.stat:
    path: "{{ sbd_stonith_dropin_dir }}/kin-delay-start.conf"
  register: sbd_stonith_delay_stat
  failed_when: not sbd_stonith_delay_stat.stat.exists
  check_mode: false
  tags: [sbd, stonith, dropins]

- name: Verify the delay-start TimeoutStartSec is set to 180
  ansible.builtin.command:
    cmd: grep -E 'TimeoutStartSec={{ sbd_stonith_timeout_start_sec }}' {{ sbd_stonith_dropin_dir }}/kin-delay-start.conf
  changed_when: false
  check_mode: false
  tags: [sbd, stonith, dropins]
