---
- name: Menyiapkan direktori drop-in sbd.service
  ansible.builtin.file:
    path: "{{ sbd_stonith_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Memasang drop-in urutan kin-softdog untuk SBD
  ansible.builtin.template:
    src: kin-ordering.conf.j2
    dest: "{{ sbd_stonith_dropin_dir }}/kin-ordering.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Muat ulang systemd setelah perubahan sbd
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Memasang drop-in SBD_DELAY_START TimeoutStartSec
  ansible.builtin.template:
    src: kin-delay-start.conf.j2
    dest: "{{ sbd_stonith_dropin_dir }}/kin-delay-start.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Muat ulang systemd setelah perubahan sbd
  when: not ansible_check_mode
  tags: [sbd, stonith, dropins]

- name: Memeriksa drop-in ordering SBD sudah ada (dry-run)
  ansible.builtin.stat:
    path: "{{ sbd_stonith_dropin_dir }}/kin-ordering.conf"
  register: sbd_stonith_ordering_stat
  failed_when: not sbd_stonith_ordering_stat.stat.exists
  check_mode: false
  tags: [sbd, stonith, dropins]

- name: Memeriksa drop-in delay-start SBD sudah ada (dry-run)
  ansible.builtin.stat:
    path: "{{ sbd_stonith_dropin_dir }}/kin-delay-start.conf"
  register: sbd_stonith_delay_stat
  failed_when: not sbd_stonith_delay_stat.stat.exists
  check_mode: false
  tags: [sbd, stonith, dropins]

- name: Memverifikasi TimeoutStartSec delay-start berisi 180
  ansible.builtin.command:
    cmd: grep -E 'TimeoutStartSec={{ sbd_stonith_timeout_start_sec }}' {{ sbd_stonith_dropin_dir }}/kin-delay-start.conf
  changed_when: false
  check_mode: false
  tags: [sbd, stonith, dropins]
