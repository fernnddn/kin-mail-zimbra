---
- name: Require a real SBD device path
  ansible.builtin.assert:
    that:
      - sbd_stonith_device | length > 0
      - sbd_stonith_device is match('^/dev/')
    fail_msg: >-
      sbd_stonith_device is empty. The iscsi_initiator role must discover
      the LUN by-id after login, or inventory must set
      iscsi_initiator_sbd_by_id. The previous role default was an old lab
      scsi-by-id that will not exist on a new pair.
  when: not ansible_check_mode
  tags: [sbd, stonith, config]

- name: Deploy the /etc/default/sbd configuration
  ansible.builtin.template:
    src: sbd.default.j2
    dest: "{{ sbd_stonith_default_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode
  tags: [sbd, stonith, config]

- name: Check SBD_DELAY_START is enabled in the configuration
  ansible.builtin.command:
    cmd: grep -E '^SBD_DELAY_START=yes' {{ sbd_stonith_default_path }}
  register: sbd_stonith_delay_grep
  changed_when: false
  check_mode: false
  tags: [sbd, stonith, config]

- name: Check the SBD devices in the configuration
  ansible.builtin.command:
    cmd: grep -F 'SBD_DEVICE="{{ sbd_stonith_device }}"' {{ sbd_stonith_default_path }}
  changed_when: false
  check_mode: false
  tags: [sbd, stonith, config]
