---
- name: Install the SBD and fence_sbd packages
  ansible.builtin.apt:
    name: "{{ sbd_stonith_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [sbd, stonith, install]

# Ubuntu sbd.service uses [Install] RequiredBy=corosync/pacemaker - enable
# creates those Requires symlinks. Without this, SBD stays inactive forever.
# Enabling alone does not start SBD when corosync/pacemaker are already
# running; activate.yml recycles the local node when that is safe.
- name: Enable sbd so corosync/pacemaker pull it in at start
  ansible.builtin.systemd:
    name: sbd
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
  tags: [sbd, stonith, install]
