---
- name: Verify the SBD device header is readable
  ansible.builtin.command:
    cmd: sbd -d {{ sbd_stonith_device }} dump
  register: sbd_stonith_dump
  changed_when: false
  failed_when: sbd_stonith_dump.rc != 0
  check_mode: false
  tags: [sbd, stonith, verify]

- name: Verify SBD_DELAY_START=yes
  ansible.builtin.command:
    cmd: grep -E '^SBD_DELAY_START=yes' {{ sbd_stonith_default_path }}
  changed_when: false
  check_mode: false
  tags: [sbd, stonith, verify]

- name: Verify sbd.service is active (not merely enabled)
  ansible.builtin.command:
    cmd: systemctl is-active sbd
  register: sbd_stonith_verify_active
  changed_when: false
  failed_when: sbd_stonith_verify_active.stdout | trim != 'active'
  check_mode: false
  tags: [sbd, stonith, verify]

- name: Verify the fence_sbd resource exists in the cluster
  ansible.builtin.command:
    cmd: pcs stonith config {{ sbd_stonith_resource_name }}
  register: sbd_stonith_pcs_verify
  changed_when: false
  failed_when: >-
    sbd_stonith_pcs_verify.rc != 0 or
    ('fence_sbd' not in sbd_stonith_pcs_verify.stdout) or
    (sbd_stonith_device not in sbd_stonith_pcs_verify.stdout) or
    (not (sbd_stonith_pcs_verify.stdout | kin_stonith_config_has_attr(
      'power_timeout', sbd_stonith_power_timeout | string)))
  check_mode: false
  run_once: true
  tags: [sbd, stonith, verify]

- name: Verify the cluster stonith-enabled and timeout settings
  ansible.builtin.command:
    cmd: pcs property config
  register: sbd_stonith_props
  changed_when: false
  failed_when: >-
    not (sbd_stonith_props.stdout | kin_pcs_has_property('stonith-enabled', 'true'))
    or not (sbd_stonith_props.stdout | kin_pcs_has_property('stonith-timeout', '150s', '150'))
  check_mode: false
  run_once: true
  tags: [sbd, stonith, verify]

- name: Note the dry-run limits for SBD_DELAY_START and real fencing
  ansible.builtin.debug:
    msg: >-
      The dry-run only confirms the file/config/STONITH resource exists.
      The effectiveness of SBD_DELAY_START (rejoin race protection) and
      fence/partition behaviour requires a real reboot/fence like task 2.3/2.9 -
      not run against the live lab through this playbook. After this role,
      schedule a deliberate graceful pcs cluster stop failover test and confirm
      the survivor promotes DRBD and starts kin-mail-svc without manual start.
  tags: [sbd, stonith, verify]
