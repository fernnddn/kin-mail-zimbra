---
- name: Include the SBD package installation steps
  ansible.builtin.import_tasks: install.yml
  tags: [sbd, stonith, install]

- name: Include the /etc/default/sbd configuration steps
  ansible.builtin.import_tasks: config.yml
  tags: [sbd, stonith, config]

- name: Include the SBD device header initialization steps
  ansible.builtin.import_tasks: initialize.yml
  tags: [sbd, stonith, initialize]

- name: Include the SBD systemd drop-in steps
  ansible.builtin.import_tasks: dropins.yml
  tags: [sbd, stonith, dropins]

- name: Apply pending systemd reload before activating SBD
  ansible.builtin.meta: flush_handlers
  tags: [sbd, stonith, activate]

- name: Include the SBD service activation steps
  ansible.builtin.import_tasks: activate.yml
  tags: [sbd, stonith, activate]

- name: Include the Pacemaker STONITH resource steps
  ansible.builtin.import_tasks: stonith.yml
  tags: [sbd, stonith, pcs]

- name: Include the SBD and STONITH verification steps
  ansible.builtin.import_tasks: verify.yml
  tags: [sbd, stonith, verify]
