---
- name: Check the SBD STONITH resource in the cluster
  ansible.builtin.command:
    cmd: pcs stonith config {{ sbd_stonith_resource_name }}
  register: sbd_stonith_pcs_config
  changed_when: false
  failed_when: false
  check_mode: false
  run_once: true
  tags: [sbd, stonith, pcs]

- name: Create the fence_sbd resource in Pacemaker
  ansible.builtin.command:
    cmd: >-
      pcs stonith create {{ sbd_stonith_resource_name }} fence_sbd
      devices={{ sbd_stonith_device }}
      pcmk_delay_max={{ sbd_stonith_pcmk_delay_max }}
      pcmk_reboot_timeout={{ sbd_stonith_pcmk_reboot_timeout }}
      pcmk_off_timeout={{ sbd_stonith_pcmk_off_timeout }}
      power_timeout={{ sbd_stonith_power_timeout }}
  run_once: true
  when:
    - sbd_stonith_pcs_config.rc != 0
    - not ansible_check_mode
  tags: [sbd, stonith, pcs]

# Existing clusters created before power_timeout was set still log
# "power timeout needs to be greater then sbd message timeout" every monitor.
- name: Ensure power_timeout on an existing fence_sbd resource
  ansible.builtin.command:
    cmd: >-
      pcs stonith update {{ sbd_stonith_resource_name }}
      power_timeout={{ sbd_stonith_power_timeout }}
      pcmk_reboot_timeout={{ sbd_stonith_pcmk_reboot_timeout }}
      pcmk_off_timeout={{ sbd_stonith_pcmk_off_timeout }}
  run_once: true
  when:
    - sbd_stonith_pcs_config.rc == 0
    - not (sbd_stonith_pcs_config.stdout | kin_stonith_config_has_attr('power_timeout', sbd_stonith_power_timeout | string))
    - not ansible_check_mode
  tags: [sbd, stonith, pcs]

- name: Enable stonith-enabled on the cluster
  ansible.builtin.command:
    cmd: pcs property set stonith-enabled=true
  run_once: true
  when: not ansible_check_mode
  changed_when: false
  tags: [sbd, stonith, pcs]

- name: Set stonith-timeout above msgwait
  ansible.builtin.command:
    cmd: pcs property set stonith-timeout={{ sbd_stonith_cluster_timeout }}
  run_once: true
  when: not ansible_check_mode
  changed_when: false
  tags: [sbd, stonith, pcs]

- name: Clear stale fence_sbd operation failures after activation
  ansible.builtin.command:
    cmd: pcs resource cleanup {{ sbd_stonith_resource_name }}
  run_once: true
  when: not ansible_check_mode
  changed_when: false
  failed_when: false
  tags: [sbd, stonith, pcs]
