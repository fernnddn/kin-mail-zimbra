---
- name: Install Prometheus and node_exporter
  ansible.builtin.apt:
    name: "{{ monitoring_stack_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
  tags: [monitoring, packages]

- name: Bind Prometheus to loopback with a one-year retention
  ansible.builtin.template:
    src: prometheus.default.j2
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus
  when: not ansible_check_mode
  tags: [monitoring, config]

- name: Bind node_exporter to loopback
  ansible.builtin.template:
    src: node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  register: monitoring_stack_node_exporter_cfg
  when: not ansible_check_mode
  tags: [monitoring, config]

# See the drop-in template for why: a private mount namespace on a unit that
# starts after /opt/zimbra is mounted can pin the DRBD backing device and block
# a later failover.
- name: Keep the monitoring units out of a private mount namespace
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_stack_prometheus_service }}"
    - "{{ monitoring_stack_node_exporter_service }}"
  when: not ansible_check_mode
  tags: [monitoring, config]

- name: Install the no-private-mount-namespace drop-ins
  ansible.builtin.template:
    src: no-private-tmp.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/10-kin-no-private-tmp.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ monitoring_stack_prometheus_service }}"
    - "{{ monitoring_stack_node_exporter_service }}"
  register: monitoring_stack_dropins
  notify: restart prometheus
  when: not ansible_check_mode
  tags: [monitoring, config]

- name: Reload systemd so the drop-ins take effect
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - monitoring_stack_dropins is defined
    - monitoring_stack_dropins.changed | default(false)
  tags: [monitoring, config]

- name: Write the Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_stack_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus
  when: not ansible_check_mode
  tags: [monitoring, config]

# Validated as a separate step rather than the template's `validate:` so a
# distribution without promtool degrades to a warning instead of failing the
# deploy with a confusing "validation command not found". The check still runs
# BEFORE flush_handlers, so a rejected config can never reach a restart.
- name: Look for promtool
  ansible.builtin.stat:
    path: /usr/bin/promtool
  register: monitoring_stack_promtool
  changed_when: false
  when: not ansible_check_mode
  tags: [monitoring, config]

- name: Validate the scrape configuration
  ansible.builtin.command:
    cmd: /usr/bin/promtool check config {{ monitoring_stack_config }}
  register: monitoring_stack_promtool_check
  changed_when: false
  when:
    - not ansible_check_mode
    - monitoring_stack_promtool.stat.exists | default(false)
  tags: [monitoring, config]

- name: Warn when the scrape configuration could not be validated
  ansible.builtin.debug:
    msg: >-
      promtool is not installed, so {{ monitoring_stack_config }} was written
      without validation. Prometheus will reject a malformed file on restart.
  when:
    - not ansible_check_mode
    - not (monitoring_stack_promtool.stat.exists | default(false))
  tags: [monitoring, config]

- name: Restart node_exporter when its listen address changed
  ansible.builtin.systemd:
    name: "{{ monitoring_stack_node_exporter_service }}"
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - (monitoring_stack_node_exporter_cfg.changed | default(false))
      or (monitoring_stack_dropins.changed | default(false))
  tags: [monitoring, service]

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: "{{ monitoring_stack_node_exporter_service }}"
    enabled: true
    state: started
  when: not ansible_check_mode
  tags: [monitoring, service]

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: "{{ monitoring_stack_prometheus_service }}"
    enabled: true
    state: started
  when: not ansible_check_mode
  tags: [monitoring, service]

- name: Apply any pending restart before verifying
  ansible.builtin.meta: flush_handlers
  tags: [monitoring, verify]

- name: Wait for the Prometheus HTTP API to answer on loopback
  ansible.builtin.uri:
    url: "http://{{ monitoring_stack_listen }}/-/ready"
    status_code: [200]
  register: monitoring_stack_ready
  until: monitoring_stack_ready.status == 200
  retries: 20
  delay: 3
  changed_when: false
  when: not ansible_check_mode
  tags: [monitoring, verify]

- name: Verify node metrics are actually being scraped
  ansible.builtin.uri:
    url: >-
      http://{{ monitoring_stack_listen }}/api/v1/query?query=up%7Bjob%3D%22node%22%7D
    return_content: true
  register: monitoring_stack_up
  # Every hop is defaulted: during startup this can answer 503 with a non-JSON
  # body, and reaching into .json.data then raises an undefined-attribute error
  # that aborts the play instead of simply retrying.
  until:
    - (monitoring_stack_up.status | default(0)) == 200
    - (monitoring_stack_up.json | default({}, true)).get('data', {}).get('result', [])
      | map(attribute='value') | map('last') | select('equalto', '1') | list | length > 0
  retries: 20
  delay: 3
  # The uri module hard-fails on a non-2xx, which would abort before `until`
  # ever retried. Let it report, and judge the outcome in the assert below.
  failed_when: false
  changed_when: false
  when: not ansible_check_mode
  tags: [monitoring, verify]

# An installed-but-empty Prometheus renders an empty Monitoring tab with no
# explanation - exactly the silent-failure class this release keeps removing.
- name: Fail if node metrics never started arriving
  ansible.builtin.assert:
    that:
      - (monitoring_stack_up.status | default(0)) == 200
      - (monitoring_stack_up.json | default({}, true)).get('data', {}).get('result', [])
        | map(attribute='value') | map('last') | select('equalto', '1') | list | length > 0
    fail_msg: >-
      Prometheus is up but is not scraping node_exporter
      ({{ monitoring_stack_node_exporter_listen }}). The console Monitoring tab
      would show empty charts with no explanation. Check
      `systemctl status {{ monitoring_stack_node_exporter_service }}` and
      `journalctl -u {{ monitoring_stack_prometheus_service }}` on this node.
  when: not ansible_check_mode
  tags: [monitoring, verify]

- name: Confirm Prometheus is not listening on a routable address
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      ss -lntH 'sport = :9090' | awk '{print $4}'
    executable: /bin/bash
  register: monitoring_stack_bind
  changed_when: false
  failed_when: >-
    monitoring_stack_bind.stdout | trim | length > 0
    and not (monitoring_stack_bind.stdout is search('127\.0\.0\.1:9090'))
  when: not ansible_check_mode
  tags: [monitoring, verify]
