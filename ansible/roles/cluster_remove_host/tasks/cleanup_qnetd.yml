---
# Precise qnetd NSS cleanup on Monitoring: delete nicknames that EXACTLY equal
# the retired hostname or "QNetd Client <hostname>". Never wildcard-delete
# QNet CA / QNetd Cert / unrelated cluster nicknames.

- name: Skip qnetd cleanup when no monitoring inventory host is defined
  ansible.builtin.debug:
    msg: >-
      cluster_remove_host_qnetd_inventory_host unset — skipping qnetd NSS
      cleanup (membership/DRBD/constraints still applied on survivor).
  when: cluster_remove_host_qnetd_inventory_host | length == 0
  tags: [cluster, remove_host, qnetd]

- name: List and select exact NSS nicknames for the retired node
  ansible.builtin.shell: |
    set -euo pipefail
    DB="{{ cluster_remove_host_qnetd_nssdb }}"
    RETIRED='{{ cluster_remove_host_retired_name }}'
    if [ ! -d "$DB" ]; then
      exit 0
    fi
    LIST=$(certutil -d "sql:${DB}" -L 2>/dev/null || certutil -d "$DB" -L 2>/dev/null || true)
    export KIN_NSS_LIST="$LIST"
    export KIN_RETIRED="$RETIRED"
    python3 - <<'PY'
    import os, re
    text = os.environ.get("KIN_NSS_LIST", "")
    retired = os.environ["KIN_RETIRED"]
    wanted = {retired, f"QNetd Client {retired}", f"QNetd Client: {retired}"}
    protected = {"QNet CA", "QNetd Cert"}
    found = []
    for line in text.splitlines():
        m = re.match(r"^(\S(?:.*?\S)?)\s{2,}", line)
        if not m:
            continue
        nick = m.group(1).strip()
        if nick in protected and nick not in wanted:
            continue
        if nick in wanted:
            found.append(nick)
    print("\n".join(found))
    PY
  args:
    executable: /bin/bash
  register: cluster_remove_host_nss_find
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: "{{ cluster_remove_host_qnetd_inventory_host }}"
  when: cluster_remove_host_qnetd_inventory_host | length > 0
  tags: [cluster, remove_host, qnetd]

- name: Set NSS delete list
  ansible.builtin.set_fact:
    cluster_remove_host_nss_delete: "{{ cluster_remove_host_nss_find.stdout_lines | default([]) | reject('equalto', '') | list }}"
  when: cluster_remove_host_qnetd_inventory_host | length > 0
  tags: [cluster, remove_host, qnetd]

- name: Delete only exact matching NSS nicknames for the retired node
  ansible.builtin.command:
    cmd: certutil -d sql:{{ cluster_remove_host_qnetd_nssdb }} -D -n {{ item }}
  loop: "{{ cluster_remove_host_nss_delete | default([]) }}"
  register: cluster_remove_host_nss_del
  changed_when: cluster_remove_host_nss_del.rc == 0
  failed_when: false
  delegate_to: "{{ cluster_remove_host_qnetd_inventory_host }}"
  when:
    - not ansible_check_mode
    - cluster_remove_host_qnetd_inventory_host | length > 0
    - (cluster_remove_host_nss_delete | default([]) | length) > 0
  tags: [cluster, remove_host, qnetd]

- name: Note qnetd NSS result (precise; no wildcard)
  ansible.builtin.debug:
    msg: >-
      qnetd NSS nicknames targeted for {{ cluster_remove_host_retired_name }}:
      {{ cluster_remove_host_nss_delete | default([]) }}.
      Empty list means no node-specific nickname existed (common with a shared
      cluster cert) — treated as success / already clean.
  when: cluster_remove_host_qnetd_inventory_host | length > 0
  tags: [cluster, remove_host, qnetd]
