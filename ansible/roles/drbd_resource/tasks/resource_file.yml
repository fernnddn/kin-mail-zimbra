---
- name: Derive DRBD replication addresses from inventory ansible_host
  ansible.builtin.set_fact:
    drbd_resource_node_a_address: "{{ hostvars[drbd_resource_node_a_name].ansible_host }}"
    drbd_resource_node_b_address: "{{ hostvars[drbd_resource_node_b_name].ansible_host }}"
  when:
    - drbd_resource_node_a_name in hostvars
    - drbd_resource_node_b_name in hostvars
    - (hostvars[drbd_resource_node_a_name].ansible_host | default('') | length) > 0
    - (hostvars[drbd_resource_node_b_name].ansible_host | default('') | length) > 0
  tags: [drbd, resource, config]

- name: Require DRBD node addresses (never silently use stale role defaults)
  ansible.builtin.assert:
    that:
      - drbd_resource_node_a_address | length > 0
      - drbd_resource_node_b_address | length > 0
      - drbd_resource_node_a_address != drbd_resource_node_b_address
      - drbd_resource_node_a_address != (corosync_qdevice_qnetd_ip | default(''))
      - drbd_resource_node_b_address != (corosync_qdevice_qnetd_ip | default(''))
    fail_msg: >-
      drbd_resource_node_*_address is empty or collides with the qnetd IP
      ({{ corosync_qdevice_qnetd_ip | default('unset') }}). Set ansible_host on
      {{ drbd_resource_node_a_name }} / {{ drbd_resource_node_b_name }}, or
      override the addresses in inventory. Do not reuse Backup/Observability IPs.
  tags: [drbd, resource, config]

- name: Deploy the kin-zimbra DRBD resource definition
  ansible.builtin.template:
    src: kin-zimbra.res.j2
    dest: "{{ drbd_resource_res_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode
  tags: [drbd, resource, config]

- name: Check the kin-zimbra resource definition uses external meta
  ansible.builtin.command:
    cmd: grep -E 'meta-disk\s+{{ drbd_resource_meta_disk | regex_escape }}' {{ drbd_resource_res_path }}
  changed_when: false
  check_mode: false
  tags: [drbd, resource, config]

- name: Ensure the definition does not use internal meta on the data disk
  ansible.builtin.command:
    # Anchored to an actual directive line (leading whitespace, trailing ;),
    # not the file's own header comment warning against meta-disk internal.
    cmd: grep -E '^\s*meta-disk\s+internal\s*;' {{ drbd_resource_res_path }}
  register: drbd_resource_internal_meta
  changed_when: false
  failed_when: drbd_resource_internal_meta.rc == 0
  check_mode: false
  tags: [drbd, resource, config]
