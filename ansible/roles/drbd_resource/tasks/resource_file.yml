---
- name: Derive DRBD replication addresses from inventory ansible_host
  ansible.builtin.set_fact:
    drbd_resource_node_a_address: "{{ hostvars[drbd_resource_node_a_name].ansible_host }}"
    drbd_resource_node_b_address: "{{ hostvars[drbd_resource_node_b_name].ansible_host }}"
  when:
    - drbd_resource_node_a_name in hostvars
    - drbd_resource_node_b_name in hostvars
    - (hostvars[drbd_resource_node_a_name].ansible_host | default('') | length) > 0
    - (hostvars[drbd_resource_node_b_name].ansible_host | default('') | length) > 0
  tags: [drbd, resource, config]

- name: Require DRBD node addresses (never silently use stale role defaults)
  ansible.builtin.assert:
    that:
      - drbd_resource_node_a_address | length > 0
      - drbd_resource_node_b_address | length > 0
      - drbd_resource_node_a_address != drbd_resource_node_b_address
      - drbd_resource_node_a_address != (corosync_qdevice_qnetd_ip | default(''))
      - drbd_resource_node_b_address != (corosync_qdevice_qnetd_ip | default(''))
    fail_msg: >-
      drbd_resource_node_*_address is empty or collides with the qnetd IP
      ({{ corosync_qdevice_qnetd_ip | default('unset') }}). Set ansible_host on
      {{ drbd_resource_node_a_name }} / {{ drbd_resource_node_b_name }}, or
      override the addresses in inventory. Do not reuse Backup/Observability IPs.
  tags: [drbd, resource, config]

- name: Deploy the kin-zimbra DRBD resource definition
  ansible.builtin.template:
    src: kin-zimbra.res.j2
    dest: "{{ drbd_resource_res_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode
  tags: [drbd, resource, config]

- name: Parse the written resource definition before anything uses it
  ansible.builtin.command:
    cmd: drbdadm dump {{ drbd_resource_name }}
  register: drbd_resource_dump
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, resource, config]

# If drbdadm will not parse the tuned definition, fall back to the ceiling
# alone rather than losing the deploy. The rate cap is the part that stops
# resync starving corosync and the SBD LUN; the controller is the refinement.
- name: Note that the tuned definition was rejected, and fall back
  ansible.builtin.set_fact:
    drbd_resource_tuning: minimal
  when:
    - not ansible_check_mode
    - drbd_resource_dump is not skipped
    - drbd_resource_dump.rc != 0
  tags: [drbd, resource, config]

- name: Re-deploy the resource definition without the rate controller
  ansible.builtin.template:
    src: kin-zimbra.res.j2
    dest: "{{ drbd_resource_res_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
    - drbd_resource_tuning == 'minimal'
  tags: [drbd, resource, config]

- name: Parse the fallback definition
  ansible.builtin.command:
    cmd: drbdadm dump {{ drbd_resource_name }}
  register: drbd_resource_dump_fallback
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - drbd_resource_tuning == 'minimal'
  tags: [drbd, resource, config]

- name: Fail loudly when drbdadm rejects the resource definition
  ansible.builtin.assert:
    that:
      - >-
        (drbd_resource_dump.rc == 0)
        or (drbd_resource_dump_fallback.rc | default(1) == 0)
    fail_msg: >-
      drbdadm cannot parse {{ drbd_resource_res_path }}:
      {{ (drbd_resource_dump_fallback.stderr
          | default(drbd_resource_dump.stderr | default(''))) | trim }}.
      Refusing to continue - a definition drbdadm will not read leaves the
      node with no replication at all, which is worse than stopping here.
  when:
    - not ansible_check_mode
    - drbd_resource_dump is not skipped
  tags: [drbd, resource, config]

# The .res file is read at attach time, so a resource that is already up keeps
# whatever net/disk options it started with. On a retry - or on a cluster that
# is live right now with the old unbounded resync - writing the file alone
# changes nothing until the next restart. adjust applies the new timeouts and
# rate ceiling to the running resource without interrupting replication.
- name: Check whether the DRBD resource is already running
  ansible.builtin.command:
    cmd: drbdadm status {{ drbd_resource_name }}
  register: drbd_resource_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, resource, config]

- name: Apply the definition to the running resource
  ansible.builtin.command:
    cmd: drbdadm adjust {{ drbd_resource_name }}
  register: drbd_resource_adjust
  changed_when: drbd_resource_adjust.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - drbd_resource_running is not skipped
    - drbd_resource_running.rc == 0
  tags: [drbd, resource, config]

- name: Report a failed adjust without stopping the run
  ansible.builtin.debug:
    msg: >-
      drbdadm adjust exited {{ drbd_resource_adjust.rc }}:
      {{ (drbd_resource_adjust.stderr | default('')) | trim }}.
      The definition on disk is correct and will apply on the next attach;
      replication was left as it was.
  when:
    - drbd_resource_adjust is defined
    - drbd_resource_adjust is not skipped
    - drbd_resource_adjust.rc | default(0) != 0
  tags: [drbd, resource, config]

- name: Check the kin-zimbra resource definition uses external meta
  ansible.builtin.command:
    cmd: grep -E 'meta-disk\s+{{ drbd_resource_meta_disk | regex_escape }}' {{ drbd_resource_res_path }}
  changed_when: false
  check_mode: false
  # Template is skipped under --check; grepping a missing .res fails closed
  # and trips any_errors_fatal on live_join_check / first-apply dry-run.
  when: not ansible_check_mode
  tags: [drbd, resource, config]

- name: Ensure the definition does not use internal meta on the data disk
  ansible.builtin.command:
    # Anchored to an actual directive line (leading whitespace, trailing ;),
    # not the file's own header comment warning against meta-disk internal.
    cmd: grep -E '^\s*meta-disk\s+internal\s*;' {{ drbd_resource_res_path }}
  register: drbd_resource_internal_meta
  changed_when: false
  failed_when: drbd_resource_internal_meta.rc == 0
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, resource, config]
