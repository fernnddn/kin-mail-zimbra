---
- name: Memeriksa image meta eksternal DRBD
  ansible.builtin.stat:
    path: "{{ drbd_resource_meta_img }}"
  register: drbd_resource_meta_img_stat
  check_mode: false
  tags: [drbd, resource, meta]

- name: Menyiapkan direktori image meta DRBD
  ansible.builtin.file:
    path: "{{ drbd_resource_meta_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - not drbd_resource_meta_img_stat.stat.exists
    - not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Membuat image meta eksternal DRBD
  ansible.builtin.command:
    cmd: truncate -s {{ drbd_resource_meta_img_size }} {{ drbd_resource_meta_img }}
    creates: "{{ drbd_resource_meta_img }}"
  when:
    - not drbd_resource_meta_img_stat.stat.exists
    - not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Memasang skrip attach loop meta DRBD
  ansible.builtin.template:
    src: kin-drbd-meta-loop.sh.j2
    dest: "{{ drbd_resource_meta_loop_script }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Memasang unit systemd meta-loop DRBD
  ansible.builtin.template:
    src: kin-drbd-meta-loop.service.j2
    dest: /etc/systemd/system/{{ drbd_resource_meta_loop_unit }}
    owner: root
    group: root
    mode: "0644"
  notify: Muat ulang systemd setelah perubahan meta-loop DRBD
  when: not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Memeriksa unit meta-loop DRBD sudah ada (dry-run)
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ drbd_resource_meta_loop_unit }}
  register: drbd_resource_meta_unit_stat
  check_mode: false
  tags: [drbd, resource, meta]

- name: Mengaktifkan layanan meta-loop DRBD agar ikut boot
  ansible.builtin.systemd:
    name: "{{ drbd_resource_meta_loop_unit }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or drbd_resource_meta_unit_stat.stat.exists
  tags: [drbd, resource, meta]

- name: Menjalankan layanan meta-loop DRBD
  ansible.builtin.systemd:
    name: "{{ drbd_resource_meta_loop_unit }}"
    state: started
  when: not ansible_check_mode or drbd_resource_meta_unit_stat.stat.exists
  tags: [drbd, resource, meta]
