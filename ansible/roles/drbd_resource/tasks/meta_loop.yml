---
- name: Check the DRBD external meta image
  ansible.builtin.stat:
    path: "{{ drbd_resource_meta_img }}"
  register: drbd_resource_meta_img_stat
  check_mode: false
  tags: [drbd, resource, meta]

- name: Prepare the DRBD meta image directory
  ansible.builtin.file:
    path: "{{ drbd_resource_meta_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - not drbd_resource_meta_img_stat.stat.exists
    - not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Create the DRBD external meta image
  ansible.builtin.command:
    cmd: truncate -s {{ drbd_resource_meta_img_size }} {{ drbd_resource_meta_img }}
    creates: "{{ drbd_resource_meta_img }}"
  when:
    - not drbd_resource_meta_img_stat.stat.exists
    - not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Deploy the DRBD meta loop attach script
  ansible.builtin.template:
    src: kin-drbd-meta-loop.sh.j2
    dest: "{{ drbd_resource_meta_loop_script }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Deploy the DRBD meta-loop systemd unit
  ansible.builtin.template:
    src: kin-drbd-meta-loop.service.j2
    dest: /etc/systemd/system/{{ drbd_resource_meta_loop_unit }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd after DRBD meta-loop changes
  when: not ansible_check_mode
  tags: [drbd, resource, meta]

- name: Check the DRBD meta-loop unit exists (dry-run)
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ drbd_resource_meta_loop_unit }}
  register: drbd_resource_meta_unit_stat
  check_mode: false
  tags: [drbd, resource, meta]

- name: Enable the DRBD meta-loop service at boot
  ansible.builtin.systemd:
    name: "{{ drbd_resource_meta_loop_unit }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or drbd_resource_meta_unit_stat.stat.exists
  tags: [drbd, resource, meta]

- name: Start the DRBD meta-loop service
  ansible.builtin.systemd:
    name: "{{ drbd_resource_meta_loop_unit }}"
    state: started
  when: not ansible_check_mode or drbd_resource_meta_unit_stat.stat.exists
  tags: [drbd, resource, meta]
