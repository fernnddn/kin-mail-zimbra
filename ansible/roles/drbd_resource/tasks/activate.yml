---
# =============================================================================
# MUTATING DRBD COMMANDS - PRODUCTION DATA ON /dev/sdb1 VIA kin-zimbra
# =============================================================================
# kin-zimbra is the LIVE production replication resource. Under ansible-playbook
# --check these tasks must remain PURE dry-run:
#
#   * Do NOT set check_mode: false on create-md / up / primary / down.
#   * Gate with `when: not ansible_check_mode` so --check never executes them.
#   * command/shell modules already skip unsupported check-mode by default;
#     the explicit `when` makes intent obvious to future editors.
#
# ONLY verify.yml may use check_mode: false (read-only status/role probes).
# Adding check_mode: false here would risk rewriting metadata or promoting
# the wrong node against live mail data. Do not "fix" dry-run that way.
# =============================================================================

- name: Check whether the DRBD resource is already up
  ansible.builtin.command:
    cmd: drbdadm status {{ drbd_resource_name }}
  register: drbd_resource_status_pre
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [drbd, resource, activate]

- name: Read the DRBD role before deciding whether to activate
  ansible.builtin.command:
    cmd: drbdadm role {{ drbd_resource_name }}
  register: drbd_resource_role_pre
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [drbd, resource, activate]

- name: Check whether Pacemaker already owns the DRBD clone
  ansible.builtin.command:
    cmd: pcs resource config {{ drbd_resource_pcs_clone }}
  register: drbd_resource_pcs_clone_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [drbd, resource, activate]

# drbdadm status exits 0 for connected Diskless leftover from a failed attach,
# and also for "both up, both Secondary" after an interrupt between `up` and
# `--force`. Neither is healthy first-apply: skip activate only when the clone
# already exists (Pacemaker owns promote) or node A is already Primary.
- name: Remember Pacemaker ownership and whether first-apply still needs activate
  ansible.builtin.set_fact:
    drbd_resource_is_diskless: >-
      {{
        (drbd_resource_status_pre.rc | int) == 0
        and ('Diskless' in (drbd_resource_status_pre.stdout | default('')))
      }}
    drbd_resource_pacemaker_owns: "{{ (drbd_resource_pcs_clone_probe.rc | int) == 0 }}"
    drbd_resource_needs_activate: >-
      {{
        not ((drbd_resource_pcs_clone_probe.rc | int) == 0)
        and (
          (drbd_resource_status_pre.rc | int) != 0
          or ('Diskless' in (drbd_resource_status_pre.stdout | default('')))
          or (
            inventory_hostname == drbd_resource_node_a_name
            and (drbd_resource_status_pre.rc | int) == 0
            and ('Primary' not in (drbd_resource_role_pre.stdout | default('')))
          )
        )
      }}
  tags: [drbd, resource, activate]

- name: Refuse to continue when DRBD is already dual-Primary
  ansible.builtin.assert:
    that:
      - (drbd_resource_role_pre.stdout | default('') | trim) != 'Primary/Primary'
    fail_msg: >-
      drbdadm role is Primary/Primary on {{ inventory_hostname }}. Refusing
      activate so this play cannot create a clone on top of split-brain.
      Demote or disconnect by hand, then retry.
  when:
    - not ansible_check_mode
    - drbd_resource_role_pre.rc is defined
    - (drbd_resource_role_pre.rc | int) == 0
  tags: [drbd, resource, activate]

- name: Note that Pacemaker owns DRBD so ansible will not down/up/force
  ansible.builtin.debug:
    msg: >-
      {{ drbd_resource_pcs_clone }} is already in the CIB. Skipping create-md,
      drbdadm down/up, and primary --force so a retry cannot fight the clone.
  when: drbd_resource_pacemaker_owns | bool
  tags: [drbd, resource, activate]

- name: Note a stale or half-up DRBD resource will be torn down before re-attach
  ansible.builtin.debug:
    msg: >-
      Resource {{ drbd_resource_name }} is already up
      (Diskless={{ drbd_resource_is_diskless }},
      role={{ drbd_resource_role_pre.stdout | default('') | trim }}).
      Running drbdadm down before wait/create-md/up so a resume cannot see
      DRBD as a holder of the LUKS mapper and fail the free-device wait.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - (drbd_resource_status_pre.rc | int) == 0
  tags: [drbd, resource, activate]

# MUST run before the free-device wait. On resume after a successful up but
# before primary --force, DRBD already holds the mapper; waiting first fails
# closed and never reaches down (live Build HA audit, 26 Aug 2026).
- name: Tear down any existing DRBD resource before metadata or attach
  ansible.builtin.command:
    cmd: drbdadm down {{ drbd_resource_name }}
  register: drbd_resource_early_down
  changed_when: drbd_resource_early_down.rc == 0
  failed_when: false
  # SAFETY: never check_mode: false - down must not run during --check.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - (drbd_resource_status_pre.rc | int) == 0
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Probe whether DRBD metadata already exists on the meta-disk
  ansible.builtin.command:
    cmd: drbdadm dump-md {{ drbd_resource_name }}
  register: drbd_resource_dump_md
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
  tags: [drbd, resource, activate]

- name: Stat the DRBD meta-disk before create-md
  ansible.builtin.stat:
    path: "{{ drbd_resource_meta_disk }}"
    follow: true
  register: drbd_resource_meta_disk_stat
  check_mode: false
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - drbd_resource_dump_md.rc is defined
    - drbd_resource_dump_md.rc != 0
  tags: [drbd, resource, activate]

- name: Combine dump-md stdout/stderr for the empty-vs-busy decision
  ansible.builtin.set_fact:
    drbd_resource_dump_md_text: >-
      {{
        (drbd_resource_dump_md.stdout | default(''))
        ~ ' '
        ~ (drbd_resource_dump_md.stderr | default(''))
      }}
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - drbd_resource_dump_md.rc is defined
  tags: [drbd, resource, activate]

- name: Refuse create-md when dump-md failed because the meta-disk is missing
  ansible.builtin.assert:
    that:
      - drbd_resource_meta_disk_stat.stat.exists | default(false)
      - drbd_resource_meta_disk_stat.stat.isblk | default(false)
    fail_msg: >-
      drbdadm dump-md failed and {{ drbd_resource_meta_disk }} is not a block
      device. Refusing create-md so a down meta-loop cannot look like empty
      metadata. Start {{ drbd_resource_meta_loop_unit }} (or attach the meta
      partition), then retry.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - drbd_resource_dump_md.rc is defined
    - drbd_resource_dump_md.rc != 0
    - (drbd_resource_status_pre.rc | int) != 0 or (drbd_resource_is_diskless | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Refuse create-md when dump-md failed with an I/O or busy error
  ansible.builtin.assert:
    that:
      - >-
        drbd_resource_dump_md_text | default('')
        is not search('(?i)no such file|device or resource busy|permission denied|can not open|cannot open|failed to open|device busy')
    fail_msg: >-
      drbdadm dump-md failed on a live block device
      ({{ drbd_resource_meta_disk }}):
      {{ drbd_resource_dump_md_text | default('') | trim }}.
      Refusing create-md so a busy or unreadable meta-disk cannot look like
      empty metadata.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - drbd_resource_dump_md.rc is defined
    - drbd_resource_dump_md.rc != 0
    - (drbd_resource_status_pre.rc | int) != 0 or (drbd_resource_is_diskless | bool)
    - drbd_resource_meta_disk_stat.stat.exists | default(false)
    - drbd_resource_meta_disk_stat.stat.isblk | default(false)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Create the DRBD metadata on the external meta-disk
  ansible.builtin.shell: |
    set -euo pipefail
    printf 'yes\n' | drbdadm create-md {{ drbd_resource_name }}
  args:
    executable: /bin/bash
  # SAFETY: never check_mode: false - create-md must not run during --check.
  # Skip when dump-md already succeeds. Skip when the resource is already up
  # (both-Secondary leftover): dump-md can fail for in-use reasons that are
  # not in the busy regex; printf yes would rewrite live metadata.
  # Diskless is torn down first; status_pre still shows rc==0, so allow
  # create-md after that down when dump-md says the meta is empty.
  # printf yes answers the empty-meta prompt so apply does not hang on stdin.
  when:
    - drbd_resource_needs_activate | bool
    - drbd_resource_dump_md.rc is defined
    - drbd_resource_dump_md.rc != 0
    - (drbd_resource_status_pre.rc | int) != 0 or (drbd_resource_is_diskless | bool)
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Settle udev before attaching the just-freed backing device
  ansible.builtin.command:
    cmd: udevadm settle --timeout=10
  changed_when: false
  failed_when: false
  # The plain-mount release a few tasks back just unmounted this same device;
  # the kernel/udev change event it fires can leave the block device
  # momentarily busy (a log-tailer or udev probe briefly re-opening it),
  # which made `drbdadm up` fail with "Can not open backing device" on a
  # perfectly good device (live 2vm practice run, 25 Aug 2026).
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Require the staged handoff script before waiting on the backing device
  ansible.builtin.stat:
    path: "{{ drbd_resource_release_dir }}/release-zimbra-plain-mount-for-drbd.sh"
  register: drbd_resource_wait_script_stat
  check_mode: false
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Fail if the handoff script was not staged (do not run --tags activate alone)
  ansible.builtin.assert:
    that:
      - drbd_resource_wait_script_stat.stat.exists | default(false)
      - drbd_resource_wait_script_stat.stat.isreg | default(false)
    fail_msg: >-
      {{ drbd_resource_release_dir }}/release-zimbra-plain-mount-for-drbd.sh is
      missing. mail-drbd.yml must run the release tag before activate (full
      play, not --tags activate alone) so wait-only can drop fail2ban and
      fuser the mapper.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

# Wait and up share one retry loop: a green wait then a transient udev/fail2ban
# reopen used to burn 10x drbdadm up retries without re-dropping holders
# (live Build HA, 26 Aug 2026).
- name: Wait for a free backing device and bring up the DRBD resource
  ansible.builtin.shell: |
    set -euo pipefail
    release='{{ drbd_resource_release_dir }}/release-zimbra-plain-mount-for-drbd.sh'
    resource='{{ drbd_resource_name }}'
    attempts=10
    delay=5
    attempt=1
    while [ "$attempt" -le "$attempts" ]; do
      # A failed prior up can leave Diskless/half-up holding the mapper.
      drbdadm down "$resource" >/dev/null 2>&1 || true
      "$release"
      if drbdadm up "$resource"; then
        echo "KIN_DRBD_UP_OK attempt=${attempt}"
        exit 0
      fi
      echo "KIN_DRBD_UP_RETRY attempt=${attempt}/${attempts}"
      attempt=$((attempt + 1))
      sleep "$delay"
    done
    echo "KIN_DRBD_UP_EXHAUSTED attempts=${attempts}"
    exit 1
  args:
    executable: /bin/bash
  environment:
    KIN_DRBD_DATA_DISK: "{{ drbd_resource_disk }}"
    KIN_DRBD_BACKING_DISK: "{{ drbd_resource_backing_disk | default(drbd_resource_disk) }}"
    KIN_DRBD_RESOURCE_NAME: "{{ drbd_resource_name }}"
    KIN_DRBD_PCS_CLONE: "{{ drbd_resource_pcs_clone }}"
    KIN_MIGRATE_LIB: "{{ drbd_resource_release_dir }}/migrate-zimbra-to-drbd-disk.sh"
    KIN_FAIL2BAN_JAILS: "{{ drbd_resource_release_dir }}/kin-fail2ban-jails.sh"
    KIN_RELEASE_WAIT_BACKING_ONLY: "1"
    KIN_RELEASE_FUSER_RETRIES: "90"
    KIN_RELEASE_FUSER_DELAY: "1"
    KIN_RELEASE_NUDGE_EVERY: "5"
    KIN_RELEASE_POST_FREE_SLEEP: "2"
  register: drbd_resource_up_result
  failed_when: false
  # SAFETY: never check_mode: false - up must not run during --check.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Dump backing-device diagnostics when drbdadm up failed
  ansible.builtin.shell: |
    set -u
    backing='{{ drbd_resource_backing_disk | default(drbd_resource_disk) }}'
    printf 'KIN_DRBD_UP_FAIL backing=%s\n' "$backing"
    findmnt -S "$backing" || true
    lsblk -o NAME,TYPE,MOUNTPOINT,FSTYPE "$backing" || true
    fuser -vm "$backing" 2>&1 || true
    fuser -v "$backing" 2>&1 || true
    if [[ "$backing" == /dev/mapper/* ]]; then
      dmsetup info "$(basename "$backing")" || true
    fi
    drbdadm status {{ drbd_resource_name }} || true
    printf '%s\n' '{{ drbd_resource_up_result.stdout | default('') }}'
    printf '%s\n' '{{ drbd_resource_up_result.stderr | default('') }}'
  args:
    executable: /bin/bash
  register: drbd_resource_up_diag
  changed_when: false
  failed_when: false
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
    - drbd_resource_up_result is defined
    - (drbd_resource_up_result.rc | default(0) | int) != 0
  tags: [drbd, resource, activate]

- name: Fail closed after a failed drbdadm up with diagnostics in the log
  ansible.builtin.fail:
    msg: >-
      drbdadm up {{ drbd_resource_name }} failed on {{ inventory_hostname }}
      (rc={{ drbd_resource_up_result.rc | default('?') }}).
      Diagnostics: {{ drbd_resource_up_diag.stdout | default('') }}
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
    - drbd_resource_up_result is defined
    - (drbd_resource_up_result.rc | default(0) | int) != 0
  tags: [drbd, resource, activate]

- name: Read the DRBD role after attach
  ansible.builtin.command:
    cmd: drbdadm role {{ drbd_resource_name }}
  register: drbd_resource_role_after_up
  changed_when: false
  failed_when: false
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
  tags: [drbd, resource, activate]

- name: Refuse primary --force when the peer is already Primary
  ansible.builtin.assert:
    that:
      - >-
        (
          (drbd_resource_role_after_up.stdout | default('') | trim).split('/')
          | last | trim
        ) != 'Primary'
    fail_msg: >-
      Peer DRBD role is already Primary
      ({{ drbd_resource_role_after_up.stdout | default('') | trim }}).
      Refusing drbdadm primary --force on {{ inventory_hostname }}
      (would dual-promote). Inspect drbdadm status; Pacemaker or a manual
      promote already owns the peer.
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
    - inventory_hostname == drbd_resource_node_a_name
    - drbd_resource_role_after_up.rc is defined
    - drbd_resource_role_after_up.rc | int == 0
  tags: [drbd, resource, activate]

- name: Force-promote to Primary only during an empty bootstrap
  ansible.builtin.command:
    cmd: drbdadm primary --force {{ drbd_resource_name }}
  # SAFETY: never check_mode: false - primary --force must not run during --check.
  # After attach, node A must be Primary so Pacemaker can take over. Do not
  # trust the pre-down Diskless fact (stale after down/up). Do not --force
  # once kin-drbd-clone exists (Pacemaker owns promotion).
  when:
    - drbd_resource_needs_activate | bool
    - not (drbd_resource_pacemaker_owns | bool)
    - not ansible_check_mode
    - inventory_hostname == drbd_resource_node_a_name
    - drbd_resource_role_after_up.rc is defined
    - drbd_resource_role_after_up.rc | int == 0
    - "'Primary' not in (drbd_resource_role_after_up.stdout | default(''))"
  tags: [drbd, resource, activate]

- name: Note that DRBD activation is skipped during a dry-run
  ansible.builtin.debug:
    msg: >-
      Resource {{ drbd_resource_name }} is already up with a disk attached,
      Pacemaker already owns {{ drbd_resource_pcs_clone }}, or this is
      --check mode: create-md / up / primary are NOT executed.
  when: >-
    ansible_check_mode
    or not (drbd_resource_needs_activate | bool)
    or (drbd_resource_pacemaker_owns | bool)
  tags: [drbd, resource, activate]
