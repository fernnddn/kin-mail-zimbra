---
# Read-only probes against the live resource. check_mode: false is intentional
# and LIMITED to status/role queries - never extend that to create-md/up/primary.

- name: Verify the kin-zimbra DRBD resource is attached
  ansible.builtin.command:
    cmd: drbdadm status {{ drbd_resource_name }}
  register: drbd_resource_status
  until: >-
    drbd_resource_status.rc == 0
    and ('Diskless' not in (drbd_resource_status.stdout | default('')))
  retries: 24
  delay: 5
  changed_when: false
  failed_when: >-
    drbd_resource_status.rc != 0
    or ('Diskless' in (drbd_resource_status.stdout | default('')))
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, resource, verify]

- name: Verify the local DRBD role
  ansible.builtin.command:
    cmd: drbdadm role {{ drbd_resource_name }}
  register: drbd_resource_role
  changed_when: false
  failed_when: >-
    drbd_resource_role.rc != 0 or
    ('Primary' not in drbd_resource_role.stdout and
     'Secondary' not in drbd_resource_role.stdout)
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, resource, verify]

- name: Verify the bootstrap primary is Primary
  ansible.builtin.assert:
    that:
      - "'Primary' in (drbd_resource_role.stdout | default(''))"
    fail_msg: >-
      {{ inventory_hostname }} is {{ drbd_resource_node_a_name }} but
      drbdadm role is not Primary after bootstrap. Pacemaker cannot promote
      an unattached or unforced resource.
  when:
    - inventory_hostname == drbd_resource_node_a_name
    - not ansible_check_mode
    - not (drbd_resource_pacemaker_owns | default(false) | bool)
  tags: [drbd, resource, verify]

- name: Verify the external meta-disk is attached to a loop device
  ansible.builtin.command:
    cmd: losetup -j {{ drbd_resource_meta_img }}
  register: drbd_resource_losetup
  changed_when: false
  failed_when: >-
    drbd_resource_losetup.rc != 0 or
    (drbd_resource_meta_disk not in drbd_resource_losetup.stdout)
  check_mode: false
  when:
    - not ansible_check_mode
    - drbd_resource_meta_disk is search('loop')
  tags: [drbd, resource, verify]

- name: Verify the DRBD meta-loop service is active
  ansible.builtin.command:
    cmd: systemctl is-active {{ drbd_resource_meta_loop_unit }}
  register: drbd_resource_meta_active
  changed_when: false
  failed_when: drbd_resource_meta_active.stdout | trim != "active"
  check_mode: false
  when:
    - not ansible_check_mode
    - drbd_resource_meta_disk is search('loop')
  tags: [drbd, resource, verify]

- name: Note that first-sync peer disk may still be Inconsistent
  ansible.builtin.debug:
    msg: >-
      Attached (not Diskless) with a Primary/Secondary role is enough to
      continue into Pacemaker. A brand-new peer stays Inconsistent until
      the first resync finishes; requiring UpToDate on both nodes here
      would block the HA sequence for the entire disk copy.
  tags: [drbd, resource, verify]
