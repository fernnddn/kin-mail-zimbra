---
- name: Include DRBD backing-disk detection
  ansible.builtin.import_tasks: detect.yml
  tags: [drbd, resource, detect]

- name: Include the DRBD external meta file steps
  ansible.builtin.import_tasks: meta_loop.yml
  when: drbd_resource_meta_disk is search('loop')
  tags: [drbd, resource, meta]

- name: Include the kin-zimbra resource definition steps
  ansible.builtin.import_tasks: resource_file.yml
  tags: [drbd, resource, config]

- name: Include the plain /opt/zimbra mount release steps (before drbdadm up)
  ansible.builtin.import_tasks: release_plain_mount.yml
  tags: [drbd, resource, release]

- name: Include the DRBD activation steps (mutating - handle with care)
  ansible.builtin.import_tasks: activate.yml
  tags: [drbd, resource, activate]

- name: Include the DRBD resource verification steps
  ansible.builtin.import_tasks: verify.yml
  tags: [drbd, resource, verify]
