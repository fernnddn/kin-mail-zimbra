---
# Production kin-zimbra: EXTERNAL meta on loop - never internal meta
# on a populated data partition (internal would overwrite end of filesystem).
drbd_resource_name: kin-zimbra
drbd_resource_device: /dev/drbd0
# Raw GPT data partition. DRBD's `disk` directive uses
# drbd_resource_backing_disk (LUKS mapper when encryption is on).
drbd_resource_disk: /dev/sdb1
drbd_resource_luks: true
drbd_resource_luks_mapper_name: kin-zimbra-crypt
drbd_resource_luks_mapper: /dev/mapper/kin-zimbra-crypt
drbd_resource_luks_keyfile: /etc/kin-mail/luks-keyfile
drbd_resource_luks_script: /usr/local/sbin/kin-ensure-zimbra-data-luks.sh
# Overwritten by tasks/luks.yml after ensure (mapper or raw).
drbd_resource_backing_disk: "{{ drbd_resource_disk }}"
drbd_resource_meta_disk: /dev/loop21
drbd_resource_meta_img: /var/lib/kin-mail/drbd-zimbra-meta.img
drbd_resource_meta_img_size: 256M
drbd_resource_meta_dir: /var/lib/kin-mail
drbd_resource_port: 7788
drbd_resource_protocol: C
# Ceiling for resync, not a fixed rate: DRBD's own controller (c-plan-ahead)
# paces itself below this. 100M was ~80%% of a 1 GbE link and, with the
# controller off, resync took it all - starving corosync, the SBD iSCSI
# session, and the DRBD keepalive on the very same NIC. 40M leaves headroom
# for all three. Raise it only on a dedicated replication network.
drbd_resource_sync_rate: 40M
drbd_resource_c_plan_ahead: 20
drbd_resource_c_fill_target: 10M
drbd_resource_c_min_rate: 4M
# Seconds.
drbd_resource_ping_int: 10
drbd_resource_connect_int: 10
# Tenths of a second. ping-timeout default is 5 (half a second), far too
# tight for a shared virtual switch. timeout must stay below ping-int and
# connect-int above.
drbd_resource_ping_timeout: 30
drbd_resource_timeout: 60
drbd_resource_res_path: /etc/drbd.d/kin-zimbra.res
# Names are placeholders only. Addresses MUST come from inventory
# ansible_host (see tasks/resource_file.yml). Empty on purpose: never bake
# site IPs into role defaults (that would aim replication at the wrong hosts).
drbd_resource_node_a_name: mail.example.test
drbd_resource_node_a_address: ""
drbd_resource_node_b_name: mail2.example.test
drbd_resource_node_b_address: ""
drbd_resource_meta_loop_script: /usr/local/sbin/kin-drbd-meta-loop.sh
drbd_resource_meta_loop_unit: kin-drbd-meta-loop.service
# After mail-pacemaker.yml the clone owns attach/promote. Ansible must not
# drbdadm down/up/primary --force on a retry (would fight self-heal).
drbd_resource_pcs_clone: kin-drbd-clone
# Staged by release_plain_mount.yml; activate.yml wait-only reuses it.
# Default so --tags activate still has a path to assert against.
drbd_resource_release_dir: /var/lib/kin-mail/drbd-plain-mount-handoff
