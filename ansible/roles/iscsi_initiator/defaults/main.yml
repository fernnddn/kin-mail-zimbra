---
iscsi_initiator_packages:
  - open-iscsi
# Must be overridden in inventory (witness/qnetd host). Empty on purpose:
# the previous default targeted an address that is now a mail node.
iscsi_initiator_portal: ""
iscsi_initiator_target_iqn: "iqn.2026-08.example.test:kin-mail-sbd"
# Override per host in inventory (mail vs mail2).
iscsi_initiator_name: "iqn.2026-08.example.test:mail"
iscsi_initiator_name_file: /etc/iscsi/initiatorname.iscsi
# Empty on purpose. The previous default was an old lab scsi-by-id that is
# not the current HA-RUNBOOK device and will not exist on a new pair.
# After login the role discovers /dev/disk/by-id/scsi-* for this IQN.
# Inventory may still override after a login if discovery is ambiguous.
iscsi_initiator_sbd_by_id: ""
iscsi_initiator_selector_remote: /var/tmp/kin-select-sbd-device.py
# CHAP for the SBD LUN - must match iscsi_target_chap_* on the Observability
# VM. Empty on purpose: the role refuses to log in rather than falling back
# to an unauthenticated session.
iscsi_initiator_chap_userid: ""
iscsi_initiator_chap_password: ""
