---
iscsi_initiator_packages:
  - open-iscsi
# Must be overridden in inventory (witness/qnetd host). Empty on purpose:
# the previous default targeted an address that is now a mail node.
iscsi_initiator_portal: ""
iscsi_initiator_target_iqn: "iqn.2026-08.site.gits-it:kin-mail-sbd"
# Override per host in inventory (mail vs mail2).
iscsi_initiator_name: "iqn.2026-08.site.gits-it:mail"
iscsi_initiator_name_file: /etc/iscsi/initiatorname.iscsi
iscsi_initiator_sbd_by_id: /dev/disk/by-id/scsi-36001405837abac113064e6da60264d82
