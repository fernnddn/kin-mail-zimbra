---
- name: Verify the iSCSI session to the SBD target
  ansible.builtin.command:
    cmd: iscsiadm -m session
  register: iscsi_initiator_session_verify
  changed_when: false
  failed_when: >-
    iscsi_initiator_session_verify.rc != 0 or
    iscsi_initiator_target_iqn not in iscsi_initiator_session_verify.stdout
  check_mode: false
  tags: [iscsi, initiator, verify]

- name: Require the SBD by-id path after login
  ansible.builtin.assert:
    that:
      - iscsi_initiator_sbd_by_id | default('') | length > 0
    fail_msg: >-
      iscsi_initiator_sbd_by_id is empty after login. Discovery looks for
      a unique scsi-* by-id whose by-path name contains this IQN
      ({{ iscsi_initiator_target_iqn }}). Override the var in inventory
      if udev names are ambiguous.
  tags: [iscsi, initiator, verify]

- name: Verify the by-id SBD device is available
  ansible.builtin.stat:
    path: "{{ iscsi_initiator_sbd_by_id }}"
  register: iscsi_initiator_sbd_dev
  failed_when: not iscsi_initiator_sbd_dev.stat.exists
  check_mode: false
  tags: [iscsi, initiator, verify]

- name: Verify the initiator name matches the inventory
  ansible.builtin.command:
    cmd: grep -F 'InitiatorName={{ iscsi_initiator_name }}' {{ iscsi_initiator_name_file }}
  changed_when: false
  check_mode: false
  tags: [iscsi, initiator, verify]

- name: Verify CHAP is configured on the SBD target's node record
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m node -T {{ iscsi_initiator_target_iqn }}
      -p {{ iscsi_initiator_portal }} --op show
  register: iscsi_initiator_chap_verify
  changed_when: false
  failed_when: >-
    iscsi_initiator_chap_verify.rc != 0 or
    'node.session.auth.authmethod = CHAP' not in iscsi_initiator_chap_verify.stdout
  check_mode: false
  no_log: true
  tags: [iscsi, initiator, verify]
