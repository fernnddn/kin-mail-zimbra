---
- name: Check the current iSCSI initiator name
  ansible.builtin.slurp:
    src: "{{ iscsi_initiator_name_file }}"
  register: iscsi_initiator_name_slurp
  failed_when: false
  check_mode: false
  tags: [iscsi, initiator, name]

- name: Set a unique iSCSI initiator name per host
  ansible.builtin.copy:
    dest: "{{ iscsi_initiator_name_file }}"
    content: |
      InitiatorName={{ iscsi_initiator_name }}
    owner: root
    group: root
    mode: "0644"
  register: iscsi_initiator_name_write
  when:
    - iscsi_initiator_name_slurp.content is not defined
      or ((iscsi_initiator_name_slurp.content | b64decode | trim) != ('InitiatorName=' ~ iscsi_initiator_name))
    - not ansible_check_mode
  tags: [iscsi, initiator, name]

- name: Restart iscsid so login uses the inventory InitiatorName
  ansible.builtin.systemd:
    name: iscsid
    state: restarted
  when:
    - iscsi_initiator_name_write is changed
    - not ansible_check_mode
  tags: [iscsi, initiator, name]
