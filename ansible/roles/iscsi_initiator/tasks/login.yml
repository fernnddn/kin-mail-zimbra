---
- name: Require the iSCSI portal address
  ansible.builtin.assert:
    that:
      - iscsi_initiator_portal | length > 0
    fail_msg: >-
      iscsi_initiator_portal is empty. Set it in inventory (wizard sets
      the monitoring VM IP:3260). The previous hardcoded default targeted
      a mail node.
  tags: [iscsi, initiator, login]

- name: Require CHAP credentials before logging in to the SBD target
  ansible.builtin.assert:
    that:
      - iscsi_initiator_chap_userid | length > 0
      - iscsi_initiator_chap_password | length >= 12
    fail_msg: >-
      iscsi_initiator_chap_userid/iscsi_initiator_chap_password must be set
      in inventory (same secret as iscsi_target_chap_* on the Observability
      VM). Refusing rather than logging in without authentication.
  tags: [iscsi, initiator, login]

- name: Check for an already active SBD iSCSI session
  ansible.builtin.command:
    cmd: iscsiadm -m session
  register: iscsi_initiator_session
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [iscsi, initiator, login]

- name: Discover the iSCSI target on the Monitoring VM
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m discovery -t sendtargets -p {{ iscsi_initiator_portal }}
  register: iscsi_initiator_discovery
  changed_when: false
  when:
    - iscsi_initiator_target_iqn not in (iscsi_initiator_session.stdout | default(''))
    - not ansible_check_mode
  tags: [iscsi, initiator, login]

- name: Configure CHAP on the SBD target's node record
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m node -T {{ iscsi_initiator_target_iqn }}
      -p {{ iscsi_initiator_portal }}
      --op update -n node.session.auth.authmethod -v CHAP
      -n node.session.auth.username -v {{ iscsi_initiator_chap_userid }}
      -n node.session.auth.password -v {{ iscsi_initiator_chap_password }}
  changed_when: true
  when:
    - iscsi_initiator_target_iqn not in (iscsi_initiator_session.stdout | default(''))
    - not ansible_check_mode
  no_log: true
  tags: [iscsi, initiator, login]

- name: Set SBD session recovery timeouts on the node record
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m node -T {{ iscsi_initiator_target_iqn }}
      -p {{ iscsi_initiator_portal }}
      --op update
      -n node.session.timeo.replacement_timeout
      -v {{ iscsi_initiator_replacement_timeout }}
      -n node.conn[0].timeo.noop_out_interval
      -v {{ iscsi_initiator_noop_interval }}
      -n node.conn[0].timeo.noop_out_timeout
      -v {{ iscsi_initiator_noop_timeout }}
  # Deliberately before --login so the first session already has them, and
  # unconditional so a retry repairs the record for the next boot even when a
  # session is up. The record is what iscsid reads on reconnect.
  changed_when: true
  when: not ansible_check_mode
  tags: [iscsi, initiator, login]

- name: Log in to the SBD iSCSI target
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m node -T {{ iscsi_initiator_target_iqn }}
      -p {{ iscsi_initiator_portal }} --login
  register: iscsi_initiator_login
  failed_when: >-
    iscsi_initiator_login.rc != 0 and
    ('already' not in (iscsi_initiator_login.stderr | default('')) | lower) and
    ('already' not in (iscsi_initiator_login.stdout | default('')) | lower)
  when:
    - iscsi_initiator_target_iqn not in (iscsi_initiator_session.stdout | default(''))
    - not ansible_check_mode
  tags: [iscsi, initiator, login]

- name: Configure automatic iSCSI login at boot
  ansible.builtin.command:
    cmd: >-
      iscsiadm -m node -T {{ iscsi_initiator_target_iqn }}
      -p {{ iscsi_initiator_portal }}
      --op update -n node.startup -v automatic
  when:
    - not ansible_check_mode
  changed_when: false
  tags: [iscsi, initiator, login]

- name: Wait for udev to publish the SBD LUN by-id
  ansible.builtin.command:
    argv: [udevadm, settle]
  when: not ansible_check_mode
  changed_when: false
  tags: [iscsi, initiator, login]

# ansible.builtin.command runs on the target. Copy the selector from role
# files/, then parse JSON. Same pattern as drbd_disk_prep: a peer does not
# have the console ansible tree on disk.
- name: Discover the SBD LUN by-id after iSCSI login
  tags: [iscsi, initiator, login]
  when:
    - not ansible_check_mode
    - (iscsi_initiator_sbd_by_id | default('') | length) == 0
  block:
    - name: Stage the SBD device selector on the target
      ansible.builtin.copy:
        src: select_sbd_device.py
        dest: "{{ iscsi_initiator_selector_remote }}"
        mode: "0755"
      changed_when: false
      tags: [iscsi, initiator, login]

    - name: Select the SBD by-id path from udev links
      ansible.builtin.command:
        argv:
          - python3
          - "{{ iscsi_initiator_selector_remote }}"
          - --iqn
          - "{{ iscsi_initiator_target_iqn }}"
          - --disk-root
          - /dev/disk
      register: iscsi_initiator_sbd_select
      changed_when: false
      failed_when: false
      tags: [iscsi, initiator, login]

    - name: Require JSON from the SBD device selector
      ansible.builtin.assert:
        that:
          - iscsi_initiator_sbd_select.stdout | default('') | trim | length > 0
        fail_msg: >-
          SBD device selector produced no JSON
          (rc={{ iscsi_initiator_sbd_select.rc | default('unset') }},
          stderr={{ iscsi_initiator_sbd_select.stderr | default('') | trim | default('(empty)') }}).
      tags: [iscsi, initiator, login]

    - name: Parse the SBD device plan
      ansible.builtin.set_fact:
        iscsi_initiator_sbd_plan: "{{ iscsi_initiator_sbd_select.stdout | from_json }}"
      tags: [iscsi, initiator, login]

    - name: Fail closed when the SBD LUN by-id is not unique
      ansible.builtin.fail:
        msg: "{{ (iscsi_initiator_sbd_plan.errors | default(['SBD LUN not found'])) | join(' ') }}"
      when: (iscsi_initiator_sbd_plan.action | default('fail')) != 'ok'
      tags: [iscsi, initiator, login]

    - name: Use the discovered SBD by-id path
      ansible.builtin.set_fact:
        iscsi_initiator_sbd_by_id: "{{ iscsi_initiator_sbd_plan.device }}"
      tags: [iscsi, initiator, login]
  always:
    - name: Remove the staged SBD device selector
      ansible.builtin.file:
        path: "{{ iscsi_initiator_selector_remote }}"
        state: absent
      changed_when: false
      tags: [iscsi, initiator, login]
