---
# Join an empty new-node disk to a LIVE UpToDate Primary (add-host).
# Shares cluster_add_host_* with cluster_survivor_replace.

cluster_add_host_survivor_name: mail.example.test
# Must be overridden in inventory (no baked-in site address).
cluster_add_host_survivor_address: ""
cluster_add_host_new_name: mail3.example.test
cluster_add_host_new_address: ""
cluster_add_host_drbd_resource: kin-zimbra
cluster_add_host_drbd_res_path: /etc/drbd.d/kin-zimbra.res
cluster_add_host_drbd_device: /dev/drbd0
cluster_add_host_drbd_disk: /dev/sdb1
cluster_add_host_drbd_meta_disk: /dev/sdb2
cluster_add_host_drbd_meta_img: /var/lib/kin-mail/drbd-zimbra-meta.img
cluster_add_host_drbd_meta_img_size: 256M
cluster_add_host_drbd_meta_dir: /var/lib/kin-mail
cluster_add_host_drbd_port: 7788
cluster_add_host_drbd_protocol: C
# Matches drbd_resource_sync_rate. This is the ceiling the rate
# controller may not cross, and Add Host triggers the longest resync
# there is: a whole disk. It was 100M here against 40M for a fresh
# pair, so a rebuilt pair pushed 2.5x as hard down the same NIC that
# carries corosync and the SBD iSCSI session.
cluster_add_host_drbd_sync_rate: 40M
cluster_add_host_drbd_meta_loop_script: /usr/local/sbin/kin-drbd-meta-loop.sh
cluster_add_host_drbd_meta_loop_unit: kin-drbd-meta-loop.service
# Wait polls for initial sync progress (logic only - untested).
cluster_add_host_drbd_sync_retries: 3
cluster_add_host_drbd_sync_delay: 30

# Template compatibility (same names as drbd_resource / survivor_replace).
drbd_resource_name: "{{ cluster_add_host_drbd_resource }}"
drbd_resource_device: "{{ cluster_add_host_drbd_device }}"
drbd_resource_disk: "{{ cluster_add_host_drbd_disk }}"
drbd_resource_meta_disk: "{{ cluster_add_host_drbd_meta_disk }}"
drbd_resource_meta_img: "{{ cluster_add_host_drbd_meta_img }}"
drbd_resource_meta_img_size: "{{ cluster_add_host_drbd_meta_img_size }}"
drbd_resource_meta_dir: "{{ cluster_add_host_drbd_meta_dir }}"
drbd_resource_port: "{{ cluster_add_host_drbd_port }}"
drbd_resource_protocol: "{{ cluster_add_host_drbd_protocol }}"
drbd_resource_sync_rate: "{{ cluster_add_host_drbd_sync_rate }}"
drbd_resource_meta_loop_script: "{{ cluster_add_host_drbd_meta_loop_script }}"
drbd_resource_meta_loop_unit: "{{ cluster_add_host_drbd_meta_loop_unit }}"
drbd_resource_node_a_name: "{{ cluster_add_host_survivor_name }}"
drbd_resource_node_a_address: "{{ cluster_add_host_survivor_address }}"
drbd_resource_node_b_name: "{{ cluster_add_host_new_name }}"
drbd_resource_node_b_address: "{{ cluster_add_host_new_address }}"

# Replication tuning. These MUST match the greenfield role: a pair rebuilt by
# Add Host was getting the old fixed-rate `syncer` and DRBD's stock 0.5s
# ping-timeout, which is the configuration whose PingAck timeouts tore down
# replication every three minutes and fed the Phase 7 fence loop. The template
# is now shared with drbd_resource; these are the values it reads.
drbd_resource_tuning: "{{ cluster_add_host_drbd_tuning | default('full') }}"
drbd_resource_ping_int: "{{ cluster_add_host_drbd_ping_int | default(10) }}"
drbd_resource_connect_int: "{{ cluster_add_host_drbd_connect_int | default(10) }}"
drbd_resource_ping_timeout: "{{ cluster_add_host_drbd_ping_timeout | default(30) }}"
drbd_resource_timeout: "{{ cluster_add_host_drbd_timeout | default(60) }}"
drbd_resource_c_plan_ahead: "{{ cluster_add_host_drbd_c_plan_ahead | default(20) }}"
drbd_resource_c_fill_target: "{{ cluster_add_host_drbd_c_fill_target | default('10M') }}"
drbd_resource_c_min_rate: "{{ cluster_add_host_drbd_c_min_rate | default('4M') }}"
