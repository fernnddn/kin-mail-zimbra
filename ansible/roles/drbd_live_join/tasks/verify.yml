---
- name: Verify the new node is Secondary and not Primary
  ansible.builtin.command:
    cmd: drbdadm role {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_role
  changed_when: false
  failed_when: >-
    drbd_live_join_role.rc != 0
    or (drbd_live_join_role.stdout | trim is search('^Primary'))
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, livejoin, verify]

- name: Verify the status is Connected or SyncTarget
  ansible.builtin.command:
    cmd: drbdadm status {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_status
  # drbdadm status can legitimately lag right after up/connect just changed
  # it - drbd_resource/tasks/verify.yml already retries the equivalent check
  # for this exact reason; this copy of it did not.
  until: >-
    drbd_live_join_status.rc == 0
    and (
      'UpToDate' in drbd_live_join_status.stdout
      or 'Inconsistent' in drbd_live_join_status.stdout
      or 'SyncTarget' in drbd_live_join_status.stdout
    )
  retries: 24
  delay: 5
  changed_when: false
  failed_when: >-
    drbd_live_join_status.rc != 0
    or (
      'UpToDate' not in drbd_live_join_status.stdout
      and 'Inconsistent' not in drbd_live_join_status.stdout
      and 'SyncTarget' not in drbd_live_join_status.stdout
    )
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, livejoin, verify]

- name: Note that live-join verification is still untested
  ansible.builtin.debug:
    msg: >-
      Live-join verification is only meaningful after applying to an empty VM.
      Under syntax-check/--check without a host, the asserts above are skipped.
  when: ansible_check_mode
  tags: [drbd, livejoin, verify]
