---
# Meta-loop setup mirrors drbd_resource (external meta required for empty new
# data disk as well — same layout as production). Mutating steps gated.

- name: Prepare the DRBD meta image directory on the new node
  ansible.builtin.file:
    path: "{{ drbd_resource_meta_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [drbd, livejoin, meta]

- name: Create the DRBD external meta image on the new node
  ansible.builtin.command:
    cmd: truncate -s {{ drbd_resource_meta_img_size }} {{ drbd_resource_meta_img }}
    creates: "{{ drbd_resource_meta_img }}"
  when: not ansible_check_mode
  tags: [drbd, livejoin, meta]

- name: Deploy the DRBD meta loop attach script on the new node
  ansible.builtin.template:
    src: kin-drbd-meta-loop.sh.j2
    dest: "{{ drbd_resource_meta_loop_script }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  tags: [drbd, livejoin, meta]

- name: Deploy the DRBD meta-loop systemd unit on the new node
  ansible.builtin.template:
    src: kin-drbd-meta-loop.service.j2
    dest: /etc/systemd/system/{{ drbd_resource_meta_loop_unit }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd after DRBD meta-loop unit changes
  when: not ansible_check_mode
  tags: [drbd, livejoin, meta]

- name: Enable and start the DRBD meta-loop on the new node
  ansible.builtin.systemd:
    name: "{{ drbd_resource_meta_loop_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [drbd, livejoin, meta]
