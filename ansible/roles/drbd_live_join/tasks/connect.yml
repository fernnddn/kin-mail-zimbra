---
# =============================================================================
# MUTATING DRBD - LIVE JOIN (full sync to UpToDate Primary)
# =============================================================================
# Scenario differs from tasks 2.4/2.5:
#   * Survivor already Primary/UpToDate and serving production mail.
#   * New node has empty (or untrusted) backing disk + fresh EXTERNAL meta.
#   * create-md + up on the NEW node only → Secondary/Inconsistent.
#   * Connect to live Primary → DRBD starts SyncSource→SyncTarget full resync
#     while Primary keeps serving (native DRBD behaviour; see drbdsetup(8)
#     connection/resync model and LINBIT user guide resync chapters).
#
# Explicitly NOT used here:
#   * drbdadm primary --force (Pacemaker owns promotion; would fight live stack)
#   * new-current-uuid --clear-bitmap / skip-sync (that assumes identical shipped
#     data; empty replacement disk MUST full-sync)
#
#   * Do NOT set check_mode: false on create-md / up / connect / wait.
#   * Gate with `when: not ansible_check_mode`.
# =============================================================================

- name: Check the DRBD status on the new node before joining
  ansible.builtin.command:
    cmd: drbdadm status {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_status_pre
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [drbd, livejoin, connect]

- name: Probe whether DRBD metadata already exists on the new-node meta-disk
  ansible.builtin.command:
    cmd: drbdadm dump-md {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_dump_md
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
  tags: [drbd, livejoin, connect]

- name: Stat the new-node DRBD meta-disk before create-md
  ansible.builtin.stat:
    path: "{{ cluster_add_host_drbd_meta_disk }}"
    follow: true
  register: drbd_live_join_meta_stat
  check_mode: false
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
    - drbd_live_join_dump_md.rc is defined
    - drbd_live_join_dump_md.rc != 0
  tags: [drbd, livejoin, connect]

- name: Refuse live-join create-md when the meta-disk is missing
  ansible.builtin.assert:
    that:
      - drbd_live_join_meta_stat.stat.exists | default(false)
      - drbd_live_join_meta_stat.stat.isblk | default(false)
    fail_msg: >-
      drbdadm dump-md failed and {{ cluster_add_host_drbd_meta_disk }} is not a
      block device. Refusing create-md on the new node.
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
    - drbd_live_join_dump_md.rc is defined
    - drbd_live_join_dump_md.rc != 0
  tags: [drbd, livejoin, connect]

- name: Refuse live-join create-md when dump-md failed with an I/O or busy error
  ansible.builtin.assert:
    that:
      - >-
        (
          (drbd_live_join_dump_md.stdout | default(''))
          ~ ' '
          ~ (drbd_live_join_dump_md.stderr | default(''))
        ) is not search('(?i)no such file|device or resource busy|permission denied|can not open|cannot open|failed to open|device busy')
    fail_msg: >-
      drbdadm dump-md failed on a live block device on the new node.
      Refusing create-md so existing metadata cannot be rewritten.
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
    - drbd_live_join_dump_md.rc is defined
    - drbd_live_join_dump_md.rc != 0
    - drbd_live_join_meta_stat.stat.exists | default(false)
    - drbd_live_join_meta_stat.stat.isblk | default(false)
  tags: [drbd, livejoin, connect]

- name: Create new DRBD metadata on the new node external meta-disk
  ansible.builtin.shell: |
    set -euo pipefail
    printf 'yes\n' | drbdadm create-md {{ cluster_add_host_drbd_resource }}
  args:
    executable: /bin/bash
  # SAFETY: never check_mode: false.
  # dump-md success means metadata already exists: do not hang on the yes
  # prompt and do not rewrite a leftover MD.
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
    - drbd_live_join_dump_md.rc is defined
    - drbd_live_join_dump_md.rc != 0
  tags: [drbd, livejoin, connect]

- name: Settle udev before attaching the just-created backing device
  ansible.builtin.command:
    cmd: udevadm settle --timeout=10
  changed_when: false
  failed_when: false
  # create-md just wrote to the backing/meta device above; drbdadm up on the
  # sibling role (drbd_resource/tasks/activate.yml) failed with "Can not
  # open backing device" right after an adjacent device-state change on a
  # live 2vm practice run (25 Aug 2026) - same shape here (new node, fresh
  # external meta-loop attach a few tasks earlier), never hardened.
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
  tags: [drbd, livejoin, connect]

- name: Bring up the DRBD resource on the new node as Secondary
  ansible.builtin.command:
    cmd: drbdadm up {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_up_result
  until: drbd_live_join_up_result.rc == 0
  retries: 5
  delay: 3
  # SAFETY: never check_mode: false - connects toward live Primary.
  when:
    - not ansible_check_mode
    - drbd_live_join_status_pre.rc != 0
  tags: [drbd, livejoin, connect]

- name: Ensure no forced promotion happens on the live-join path
  ansible.builtin.debug:
    msg: >-
      drbdadm primary --force is INTENTIONALLY not called in drbd_live_join.
      The survivor stays Primary; the new node waits for full sync as Secondary.
  tags: [drbd, livejoin, connect]

- name: Check the initial sync progress toward the live Primary
  ansible.builtin.command:
    cmd: drbdadm status {{ cluster_add_host_drbd_resource }}
  register: drbd_live_join_status_sync
  changed_when: false
  failed_when: false
  # SAFETY: read-only probe may run; do not force mutating retries under --check.
  check_mode: false
  when: not ansible_check_mode
  tags: [drbd, livejoin, connect]

- name: Note that connect/full-sync is skipped during a dry-run
  ansible.builtin.debug:
    msg: >-
      --check mode: create-md / up / connect are NOT executed. This logic
      has NEVER been tested against any host - full sync to a live Primary is
      still a hypothesis based on official documentation, not KIN Mail lab proof.
  when: ansible_check_mode
  tags: [drbd, livejoin, connect]
