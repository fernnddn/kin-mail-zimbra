---
# Poll interval and attempt count while waiting for sbd to arm on a node.
# SBD_DELAY_START can hold the unit in `activating` for ~70s on a fresh
# LUN, so the default ceiling here is 24 x 5s = 120s.
observability_rearm_wait_sec: 5
observability_arm_retries: 24
observability_sbd_stop_order: ""
observability_promoted: ""
observability_disarm_dropin: >-
  /run/systemd/system/sbd.service.d/kin-observability-disarm.conf
observability_allow_manual_dropin: >-
  /run/systemd/system/sbd.service.d/kin-observability-allow-manual.conf
observability_kin_mail_config: /etc/kin-mail/config
observability_new_ip: "{{ corosync_qdevice_qnetd_ip | default('') }}"
