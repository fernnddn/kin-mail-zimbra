---
# =============================================================================
# MUTATING pcs — add NEW identity to live cluster
# =============================================================================
# Official pattern (RHEL "Managing cluster nodes"):
#   pcs host auth <newnode>
#   pcs cluster node add <newnode>
# This syncs corosync.conf to all members including the new node.
#
# Prerequisites (playbook order): new node already has pcs/pcsd + hacluster
# password matching cluster_add_host_hacluster_password.
#
#   * Do NOT set check_mode: false on auth / node add / cluster start.
#   * Gate with `when: not ansible_check_mode`.
# =============================================================================

- name: Check whether the new node is already a cluster member
  ansible.builtin.command:
    cmd: pcs status nodes corosync
  register: cluster_survivor_replace_nodes_add
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [cluster, survivor, corosync]

- name: Authenticate the new host to the survivor pcsd
  ansible.builtin.command:
    cmd: >-
      pcs host auth {{ cluster_add_host_new_name }}
      -u {{ cluster_add_host_hacluster_user }}
      -p {{ cluster_add_host_hacluster_password }}
  # SAFETY: never check_mode: false.
  no_log: true
  when:
    - not ansible_check_mode
    - cluster_add_host_hacluster_password | length > 0
    - cluster_add_host_new_name not in cluster_survivor_replace_nodes_add.stdout
  tags: [cluster, survivor, corosync]

- name: Add the new node to Corosync membership
  ansible.builtin.command:
    cmd: >-
      pcs cluster node add {{ cluster_add_host_new_name }}
      addr={{ cluster_add_host_new_address }}
  # SAFETY: never check_mode: false — rewrites live corosync.conf / authkeys.
  when:
    - not ansible_check_mode
    - cluster_add_host_new_name not in cluster_survivor_replace_nodes_add.stdout
  tags: [cluster, survivor, corosync]

- name: Start the cluster services on the new node from the survivor
  ansible.builtin.command:
    cmd: pcs cluster start {{ cluster_add_host_new_name }}
  # SAFETY: never check_mode: false.
  when:
    - not ansible_check_mode
    - cluster_add_host_new_name not in cluster_survivor_replace_nodes_add.stdout
  tags: [cluster, survivor, corosync]

- name: Enable cluster start at boot on the new node
  ansible.builtin.command:
    cmd: pcs cluster enable {{ cluster_add_host_new_name }}
  # SAFETY: never check_mode: false.
  when: not ansible_check_mode
  tags: [cluster, survivor, corosync]

- name: Note that pcs node add is skipped during a dry-run or the node is already a member
  ansible.builtin.debug:
    msg: >-
      pcs host auth / cluster node add {{ cluster_add_host_new_name }} was NOT
      executed (--check mode or the node is already in membership). It has never
      been tested against a real host in slice 3.7.
  when: >-
    ansible_check_mode
    or (cluster_add_host_new_name in cluster_survivor_replace_nodes_add.stdout)
  tags: [cluster, survivor, corosync]
