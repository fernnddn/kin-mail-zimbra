---
# Add-host survivor path: remove retired (shared role) → add new → rewrite DRBD
# peer to new identity → verify. Removal logic lives in cluster_remove_host.

- name: Remove the permanently lost peer (shared cluster_remove_host role)
  ansible.builtin.include_role:
    name: cluster_remove_host
  tags: [cluster, survivor, remove]

- name: Include adding the new node to Corosync
  ansible.builtin.import_tasks: corosync_add.yml
  tags: [cluster, survivor, corosync]

- name: Include the DRBD peer update to the new identity
  ansible.builtin.import_tasks: drbd_peer.yml
  tags: [cluster, survivor, drbd]

- name: Include the survivor verification after the replace
  ansible.builtin.import_tasks: verify.yml
  tags: [cluster, survivor, verify]
