---
# =============================================================================
# MUTATING cleanup of RETIRED identity leftovers on the survivor / CIB
# =============================================================================
# Keep mail running on survivor; only remove dangling references that would
# confuse future failovers (lost-node CRM entries, host-specific constraints,
# stale DRBD "on <old>" if any file copy remains).
#
#   * Do NOT set check_mode: false on crm_node / pcs constraint remove.
# =============================================================================

- name: Remove the old node CRM entry if it is still recorded as lost
  ansible.builtin.command:
    cmd: crm_node -R {{ cluster_add_host_retired_name }} --force
  register: cluster_survivor_replace_crm_rm
  changed_when: cluster_survivor_replace_crm_rm.rc == 0
  failed_when: false
  # SAFETY: never check_mode: false.
  when: not ansible_check_mode
  tags: [cluster, survivor, cleanup]

- name: Check for location constraints that reference the old hostname
  ansible.builtin.command:
    cmd: pcs constraint location
  register: cluster_survivor_replace_loc
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [cluster, survivor, cleanup]

- name: Note location constraints that still reference the old node
  ansible.builtin.debug:
    msg: >-
      A location constraint still references {{ cluster_add_host_retired_name }} —
      review it manually (pcs constraint location remove …) before an automated apply.
      Output: {{ cluster_survivor_replace_loc.stdout }}
  when: cluster_add_host_retired_name in cluster_survivor_replace_loc.stdout
  tags: [cluster, survivor, cleanup]

- name: Ensure the DRBD resource file no longer contains the old hostname
  ansible.builtin.command:
    cmd: grep -F {{ cluster_add_host_retired_name }} {{ cluster_add_host_drbd_res_path }}
  register: cluster_survivor_replace_old_in_res
  changed_when: false
  failed_when: cluster_survivor_replace_old_in_res.rc == 0
  check_mode: false
  when: not ansible_check_mode
  tags: [cluster, survivor, cleanup]

- name: Note the old qdevice certificate cleanup on qnetd (manual follow-up)
  ansible.builtin.debug:
    msg: >-
      The qdevice certificate/client for {{ cluster_add_host_retired_name }} may
      still exist in the qnetd NSS database on Monitoring. Remove it manually with
      corosync-qnetd-certutil once the new node is proven healthy — this is not
      automated in this first logic (risk of deleting the wrong CA/cluster cert).
  tags: [cluster, survivor, cleanup]
