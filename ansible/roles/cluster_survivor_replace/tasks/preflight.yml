---
- name: Verify the cluster has quorum before changing membership
  ansible.builtin.command:
    cmd: pcs status
  register: cluster_survivor_replace_pcs_pre
  changed_when: false
  failed_when: >-
    cluster_survivor_replace_pcs_pre.rc != 0
    or ('partition with quorum' not in cluster_survivor_replace_pcs_pre.stdout
        and 'With Quorum' not in cluster_survivor_replace_pcs_pre.stdout)
  check_mode: false
  tags: [cluster, survivor, preflight]

- name: Verify the survivor is still DRBD Primary and UpToDate
  ansible.builtin.command:
    cmd: drbdadm role {{ cluster_add_host_drbd_resource }}
  register: cluster_survivor_replace_drbd_role
  changed_when: false
  failed_when: >-
    cluster_survivor_replace_drbd_role.rc != 0
    or ('Primary' not in cluster_survivor_replace_drbd_role.stdout)
  check_mode: false
  tags: [cluster, survivor, preflight]

- name: Note that the add-host scenario has never been tested
  ansible.builtin.debug:
    msg: >-
      Role cluster_survivor_replace is NEW LOGIC with no task 2.x precedent
      and has NEVER been run against any host. Preflight is only valid when the
      play targets the live survivor — slice 3.7 intentionally does not do that.
  tags: [cluster, survivor, preflight]
