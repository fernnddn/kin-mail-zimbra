---
- name: Verify the new node appears in Corosync membership
  ansible.builtin.command:
    cmd: pcs status nodes corosync
  register: cluster_survivor_replace_nodes_v
  changed_when: false
  failed_when: >-
    cluster_survivor_replace_nodes_v.rc != 0
    or (cluster_add_host_new_name not in cluster_survivor_replace_nodes_v.stdout)
  check_mode: false
  when: not ansible_check_mode
  tags: [cluster, survivor, verify]

- name: Verify the old node is no longer in membership
  ansible.builtin.command:
    cmd: pcs status nodes corosync
  register: cluster_survivor_replace_nodes_gone
  changed_when: false
  failed_when: cluster_add_host_retired_name in cluster_survivor_replace_nodes_gone.stdout
  check_mode: false
  when: not ansible_check_mode
  tags: [cluster, survivor, verify]

- name: Note that membership verification is skipped on dry-run / syntax-only
  ansible.builtin.debug:
    msg: >-
      Membership verification is skipped under --check/syntax-only — slice 3.7 has
      no target VM. Once an empty host exists, assert new in / retired out.
  when: ansible_check_mode
  tags: [cluster, survivor, verify]
