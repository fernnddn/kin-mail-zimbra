---
# Example inventory — Monitoring + mail nodes (qdevice + fencing).
# Copy to lab.yml (gitignored) and fill in auth — never commit passwords.
#
#   cp inventory/lab.example.yml inventory/lab.yml
#
# Rebuild topology (2026-08-12):
#   mail  (Zimbra 01 / Host A) : 10.10.40.15
#   mail2 (Zimbra 02 / Host B) : 10.10.40.14  — empty peer, no Zimbra install
#   mon   (Observability)      : 10.10.40.12

all:
  vars:
    # Keep in sync with live lab.yml — role defaults still ship old IPs.
    corosync_qdevice_qnetd_ip: 10.10.40.12
    corosync_qdevice_qnetd_inventory_host: mon.gits-it.site
    iscsi_initiator_portal: "10.10.40.12:3260"
    # Set in lab.yml (gitignored) before pcs cluster setup / host auth.
    cluster_node_base_hacluster_password: ""
    # Override after iSCSI login — role defaults still ship the old lab by-id.
    # iscsi_initiator_sbd_by_id: /dev/disk/by-id/scsi-…
    # sbd_stonith_device: /dev/disk/by-id/scsi-…
    # Rebuild: Host A is 10.10.40.15 — do NOT reuse old-lab VIP .15.
    # pacemaker_mail_stack_vip_ip: 10.10.40.16
    # Partition meta: leave meta-loop empty (no kin-drbd-meta-loop.service).
    # pacemaker_agents_keep_meta_loop_unit: ""
  children:
    monitoring:
      hosts:
        mon.gits-it.site:
          ansible_host: 10.10.40.12
          ansible_user: cursor
          # ansible_password: "..."
          # ansible_become_password: "..."
    mail_nodes:
      hosts:
        mail.gits-it.site:
          ansible_host: 10.10.40.15
          ansible_user: cursor
          iscsi_initiator_name: "iqn.2026-08.site.gits-it:mail"
          # Host A / current Primary — Z-Push until HA placement is decided.
          zpush_install_enabled: true
          # ansible_password: "..."
          # ansible_become_password: "..."
        mail2.gits-it.site:
          ansible_host: 10.10.40.14
          ansible_user: cursor
          iscsi_initiator_name: "iqn.2026-08.site.gits-it:mail2"
          # Host B — leave false until Pacemaker / dual-node Z-Push design lands.
          zpush_install_enabled: false
          # ansible_password: "..."
          # ansible_become_password: "..."
