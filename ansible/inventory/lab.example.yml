---
# Example inventory - Observability + mail nodes (qdevice + fencing).
# Copy to lab.yml (gitignored) and fill in auth - never commit passwords.
#
#   cp inventory/lab.example.yml inventory/lab.yml
#
# Placeholder addresses use RFC 5737 documentation space only:
#   mail  (Mail A)        : 192.0.2.15
#   mail2 (Mail B)        : 192.0.2.14
#   mon   (Observability) : 192.0.2.12
#   VIP                   : 192.0.2.16

all:
  vars:
    corosync_qdevice_qnetd_ip: 192.0.2.12
    corosync_qdevice_qnetd_inventory_host: mon.example.test
    iscsi_initiator_portal: "192.0.2.12:3260"
    # Set in lab.yml (gitignored). Both roles refuse to run without these -
    # same secret on the target (Observability) and every initiator (mail
    # nodes). iscsiadm requires 12-16 chars.
    iscsi_target_chap_userid: ""
    iscsi_target_chap_password: ""
    iscsi_initiator_chap_userid: ""
    iscsi_initiator_chap_password: ""
    # Set in lab.yml (gitignored) before pcs cluster setup / host auth.
    cluster_node_base_hacluster_password: ""
    # After iSCSI login the initiator role discovers scsi-* by-id for the SBD
    # IQN. Override only if that discovery is ambiguous:
    # iscsi_initiator_sbd_by_id: /dev/disk/by-id/scsi-...
    # sbd_stonith_device: /dev/disk/by-id/scsi-...
    # VIP must be unused (never a mail-node address).
    pacemaker_mail_stack_vip_ip: 192.0.2.16
    drbd_resource_node_a_name: mail.example.test
    drbd_resource_node_a_address: 192.0.2.15
    drbd_resource_node_b_name: mail2.example.test
    drbd_resource_node_b_address: 192.0.2.14
    drbd_resource_disk: /dev/sdb1
    drbd_resource_meta_disk: /dev/sdb2
    pacemaker_agents_keep_meta_loop_unit: ""
  children:
    monitoring:
      hosts:
        mon.example.test:
          ansible_host: 192.0.2.12
          ansible_user: kin
          # ansible_password: "..."
          # ansible_become_password: "..."
    mail_nodes:
      hosts:
        mail.example.test:
          ansible_host: 192.0.2.15
          ansible_user: kin
          iscsi_initiator_name: "iqn.2026-08.example.test:mail"
          zpush_install_enabled: true
          # ansible_password: "..."
          # ansible_become_password: "..."
        mail2.example.test:
          ansible_host: 192.0.2.14
          ansible_user: kin
          iscsi_initiator_name: "iqn.2026-08.example.test:mail2"
          zpush_install_enabled: false
          # ansible_password: "..."
          # ansible_become_password: "..."
