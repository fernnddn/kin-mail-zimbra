---
# Example inventory for standalone remove-host (unreachable peer cleanup).
# Copy and edit - do NOT point this at a healthy live peer as a drill.
#
#   cp inventory/remove-host.example.yml inventory/remove-host.yml
#
# Then on the survivor only:
#   ansible-playbook -i inventory/remove-host.yml playbooks/mail-remove-host.yml --syntax-check

all:
  vars:
    cluster_remove_host_survivor_name: mail.example.test
    cluster_remove_host_survivor_address: 192.0.2.15
    cluster_remove_host_retired_name: mail2.example.test
    cluster_remove_host_retired_address: 192.0.2.14
    # Copy and replace names/IPs with the live Pacemaker nodelist
    # (hostname -f). The role reads the live .res first and refuses
    # /dev/loop21 unless that file already uses it.
    cluster_remove_host_drbd_disk: /dev/sdb1
    cluster_remove_host_drbd_meta_disk: /dev/sdb2
  children:
    monitoring:
      hosts:
        mon.example.test:
          ansible_host: 192.0.2.12
          ansible_user: kin
    mail_survivor:
      hosts:
        mail.example.test:
          ansible_host: 192.0.2.15
          ansible_user: kin
