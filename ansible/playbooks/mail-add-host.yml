---
# =============================================================================
# Add-host orchestration - replace a permanently lost mail peer with a NEW
# identity (hostname/IP), not impersonating the retired node.
#
# Console Cluster → Add a second server calls this playbook when the survivor
# still has a live one-node Pacemaker cluster (after Remove Host). Greenfield
# Build HA pair must not be used against that CIB.
#
# Official references encoded in roles:
#   * pcs cluster node remove / pcs host auth / pcs cluster node add
#     (RHEL HA "Managing cluster nodes")
#   * DRBD live full resync: empty Secondary create-md/up → connect to
#     UpToDate Primary (drbdsetup(8) / LINBIT resync model) - NOT
#     clear-bitmap skip-sync, NOT cold dual primary --force.
#
# Manual:
#   ansible-playbook -i inventory/add-host.yml playbooks/mail-add-host.yml
# =============================================================================

- name: Validate add-host identity variables
  hosts: mail_survivor
  gather_facts: false
  become: false
  run_once: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  tasks:
    - name: Ensure the new node name differs from the old node
      ansible.builtin.assert:
        that:
          - cluster_add_host_new_name is defined
          - cluster_add_host_retired_name is defined
          - cluster_add_host_survivor_name is defined
          - cluster_add_host_new_name != cluster_add_host_retired_name
          - cluster_add_host_new_name != cluster_add_host_survivor_name
          - cluster_add_host_new_address is defined
          - cluster_add_host_new_address != cluster_add_host_retired_address | default('')
        fail_msg: >-
          Fill in cluster_add_host_* in the add-host inventory: the new identity MUST
          differ from the survivor and from the node being replaced.
      tags: [addhost, validate]

# -----------------------------------------------------------------------------
# 1) NEW NODE - package / fencing / agents readiness (before pcs node add)
# -----------------------------------------------------------------------------
- name: Prepare packages and agents on the new mail node
  hosts: mail_new_node
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: cluster_node_base
      tags: [addhost, new, base]
    - role: iscsi_initiator
      tags: [addhost, new, iscsi]
    - role: softdog
      tags: [addhost, new, softdog]
    - role: sbd_stonith
      tags: [addhost, new, sbd]
    - role: drbd_install
      tags: [addhost, new, drbd]
    - role: drbd_disk_prep
      tags: [addhost, new, disk_prep]
    - role: pacemaker_agents
      tags: [addhost, new, agents]

- name: Ensure LUKS under the new-node DRBD data partition
  hosts: mail_new_node
  gather_facts: false
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  tasks:
    - name: Include DRBD LUKS ensure (new node only)
      ansible.builtin.include_role:
        name: drbd_resource
        tasks_from: luks.yml
      tags: [addhost, new, luks]

# -----------------------------------------------------------------------------
# 2) SURVIVOR - remove retired, rewrite DRBD peer, pcs cluster node add
# -----------------------------------------------------------------------------
- name: Prepare the survivor and add the new node to the cluster
  hosts: mail_survivor
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: cluster_survivor_replace
      tags: [addhost, survivor]

# -----------------------------------------------------------------------------
# 3) qdevice TLS - survivor first so PKCS12 can distribute to the new node
# -----------------------------------------------------------------------------
- name: Deploy qdevice TLS for the survivor and new node pair
  hosts: mail_survivor,mail_new_node
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: corosync_qdevice
      tags: [addhost, qdevice]

# -----------------------------------------------------------------------------
# 4) NEW NODE - DRBD live join (full sync while survivor stays Primary)
# -----------------------------------------------------------------------------
- name: Connect the new node DRBD to the live Primary for full sync
  hosts: mail_new_node
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: drbd_live_join
      tags: [addhost, livejoin]

# -----------------------------------------------------------------------------
# 5) NEW NODE - built-in metrics
# -----------------------------------------------------------------------------
# Last, and deliberately after the cluster work. Without this the replacement
# node has no Prometheus, no node_exporter and no mail flow collector, so the
# Monitoring and Reports tabs go blank the first time the VIP lands on it and
# the operator sees monitoring "disappear" on a failover. Additive: it installs
# packages and writes loopback config, and touches no cluster state.
- name: Install built-in monitoring on the new node
  hosts: mail_new_node
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: monitoring_stack
      tags: [addhost, monitoring]
