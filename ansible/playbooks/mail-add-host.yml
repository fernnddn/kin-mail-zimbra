---
# =============================================================================
# Add-host orchestration — replace a permanently lost mail peer with a NEW
# identity (hostname/IP), not impersonating the retired node.
#
# SCOPE (slice 3.7): build logic + ansible-playbook --syntax-check ONLY.
# There is NO empty VM to target. This playbook has NEVER been executed
# against any host (not merely "not fully applied").
#
# Official references encoded in roles:
#   * pcs cluster node remove / pcs host auth / pcs cluster node add
#     (RHEL HA "Managing cluster nodes")
#   * DRBD live full resync: empty Secondary create-md/up → connect to
#     UpToDate Primary (drbdsetup(8) / LINBIT resync model) — NOT
#     clear-bitmap skip-sync, NOT cold dual primary --force from 2.4/2.5.
#
# When a blank VM exists:
#   ansible-playbook -i inventory/add-host.yml playbooks/mail-add-host.yml --check
# =============================================================================

- name: Memvalidasi variabel identitas add-host
  hosts: mail_survivor
  gather_facts: false
  become: false
  run_once: true
  tasks:
    - name: Memastikan nama node baru berbeda dari node lama
      ansible.builtin.assert:
        that:
          - cluster_add_host_new_name is defined
          - cluster_add_host_retired_name is defined
          - cluster_add_host_survivor_name is defined
          - cluster_add_host_new_name != cluster_add_host_retired_name
          - cluster_add_host_new_name != cluster_add_host_survivor_name
          - cluster_add_host_new_address is defined
          - cluster_add_host_new_address != cluster_add_host_retired_address | default('')
        fail_msg: >-
          Isi cluster_add_host_* di inventory add-host: identitas baru HARUS
          berbeda dari survivor dan dari node yang diganti.
      tags: [addhost, validate]

    - name: Mencatat status pembuktian slice 3.7
      ansible.builtin.debug:
        msg: >-
          Playbook mail-add-host: logic + syntax saja. BELUM PERNAH dijalankan
          ke host mana pun (bukan sekadar 'belum full apply').
      tags: [addhost, validate]

# -----------------------------------------------------------------------------
# 1) NEW NODE — package / fencing / agents readiness (before pcs node add)
# -----------------------------------------------------------------------------
- name: Menyiapkan paket dan agen di node mail baru
  hosts: mail_new_node
  gather_facts: true
  become: true
  roles:
    - role: cluster_node_base
      tags: [addhost, new, base]
    - role: iscsi_initiator
      tags: [addhost, new, iscsi]
    - role: softdog
      tags: [addhost, new, softdog]
    - role: sbd_stonith
      tags: [addhost, new, sbd]
    - role: drbd_install
      tags: [addhost, new, drbd]
    - role: pacemaker_agents
      tags: [addhost, new, agents]

# -----------------------------------------------------------------------------
# 2) SURVIVOR — remove retired, rewrite DRBD peer, pcs cluster node add
# -----------------------------------------------------------------------------
- name: Menyiapkan survivor dan menambahkan node baru ke cluster
  hosts: mail_survivor
  gather_facts: true
  become: true
  roles:
    - role: cluster_survivor_replace
      tags: [addhost, survivor]

# -----------------------------------------------------------------------------
# 3) qdevice TLS — survivor first so PKCS12 can distribute to the new node
# -----------------------------------------------------------------------------
- name: Memasang TLS qdevice untuk pasangan survivor dan node baru
  hosts: mail_survivor,mail_new_node
  gather_facts: true
  become: true
  roles:
    - role: corosync_qdevice
      tags: [addhost, qdevice]

# -----------------------------------------------------------------------------
# 4) NEW NODE — DRBD live join (full sync while survivor stays Primary)
# -----------------------------------------------------------------------------
- name: Menghubungkan DRBD node baru ke Primary live untuk full sync
  hosts: mail_new_node
  gather_facts: true
  become: true
  roles:
    - role: drbd_live_join
      tags: [addhost, livejoin]
