---
# Rebuild a replacement Observability VM and reconnect both live mail nodes.
# Does not mutate Zimbra / DRBD / Pacemaker mail resources.
# TLS reinit is required: a fresh qnetd has a new NSS identity.

- name: Install qnetd and the iSCSI SBD target on the new Observability VM
  hosts: monitoring
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    # A replacement VM arrives with whatever hostname its image shipped with,
    # exactly like the first one did. Renaming it here means Remove then Add
    # leaves the same estate you started with, rather than one arbitration host
    # called `observability` and its replacement called `ubuntu`.
    - role: observability_identity
      tags: [observability, add, identity]
    - role: corosync_qnetd
      tags: [observability, add, qnetd]
    - role: iscsi_target
      tags: [observability, add, iscsi]

- name: Reconnect qdevice clients on both mail nodes
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: iscsi_initiator
      tags: [observability, add, iscsi]
    - role: corosync_qdevice
      tags: [observability, add, qdevice]
    - role: observability_rearm
      tags: [observability, add, rearm]
