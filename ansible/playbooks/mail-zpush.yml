---
# Z-Push ActiveSync + Autodiscover (Phase 4) on mail nodes.
#
# Nginx snippets under /opt/z-push are required on EVERY mail node (the
# Zimbra template on DRBD includes them). Full Z-Push (PHP, backend, proxy
# restart) stays enabled only on the current Primary until dual-node
# ActiveSync is designed.
#
# Snippets only (safe on Host B, no zmproxy restart):
#   ansible-playbook playbooks/mail-zpush.yml --tags snippets
#
# Role-level tags: [zpush] on the full-install play would skip the entire
# role when HA orchestration passes --tags snippets. Keep snippets in a
# separate play so that tag actually writes the files.
#
# Dry-run against production cluster:
#   ansible-playbook playbooks/mail-zpush.yml --limit mail.example.test --check
#
# PRODUCTION WARNING: nginx template edits + zmproxyctl restart are gated with
# `when: not ansible_check_mode` and only run when snippets/template change.
# Do not add check_mode: false on those mutating tasks.

- name: Deploy Z-Push nginx snippets on every mail node
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  tasks:
    - name: Include Z-Push nginx snippets
      ansible.builtin.import_role:
        name: zpush_install
        tasks_from: snippets.yml
      tags: [zpush, snippets]

- name: Install Z-Push with Zimbra backend on enabled mail nodes
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: zpush_install
      tags: [zpush]
