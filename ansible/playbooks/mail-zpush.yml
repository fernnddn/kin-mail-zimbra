---
# Z-Push ActiveSync + Autodiscover (Phase 4) on mail nodes.
#
# Nginx snippets under /opt/z-push are required on EVERY mail node (the
# Zimbra template on DRBD includes them). Full Z-Push (PHP, backend, proxy
# restart) stays enabled only on the current Primary until dual-node
# ActiveSync is designed.
#
# Snippets only (safe on Host B, no zmproxy restart):
#   ansible-playbook playbooks/mail-zpush.yml --tags snippets
#
# Dry-run against live lab:
#   ansible-playbook playbooks/mail-zpush.yml --limit mail.gits-it.site --check
#
# PRODUCTION WARNING: nginx template edits + zmproxyctl restart are gated with
# `when: not ansible_check_mode` and only run when snippets/template change.
# Do not add check_mode: false on those mutating tasks.

- name: Install Z-Push with Zimbra backend on enabled mail nodes
  hosts: mail_nodes
  gather_facts: true
  become: true
  roles:
    - role: zpush_install
      tags: [zpush]
