---
# Forced cleanup after Observability is already unreachable.
# Hosts: mail_nodes only. Do not run the mail-node remove or replace roles.

- name: Disarm SBD and clear Observability references on both mail nodes
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: observability_disarm
      tags: [observability, remove]
