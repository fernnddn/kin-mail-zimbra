---
# OS-level Part A on every mail node (fail2ban + unattended-upgrades).
#
# Same behaviour as install/09-hardening.sh --os-only. Does NOT apply COS
# lockout, IMAP/POP cleartext, TLS ciphers, or SMTP rates - those live in
# shared LDAP/DRBD and follow the volume when a node is promoted.
#
# Safe on Host A (live Zimbra): no zmprov / zmproxyctl / postfix reload.
# Safe on Host B (stopped throwaway Zimbra): no LDAP writes; zimbra-auth /
# zpush-auth jails enable only when the matching log files exist.
#
#   ansible-playbook playbooks/mail-os-hardening.yml --check
#   ansible-playbook playbooks/mail-os-hardening.yml
#   ansible-playbook playbooks/mail-os-hardening.yml -e os_hardening_smoke_ban=true

- name: Apply OS-level hardening on Host A and Host B
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: os_hardening
      tags: [hardening, os]
