---
# Port of Phase 2 softdog stage §1 - corosync-qdevice clients on Host A + Host B.
# Requires Monitoring qnetd (role corosync_qnetd / playbook mon-qnetd.yml).
# Out of scope: iSCSI/SBD/softdog/Pacemaker STONITH (later slices).
#
# Dry-run against production cluster only:
#   ansible-playbook playbooks/mail-qdevice.yml --check
#
# Do NOT full-apply on the production HA pair until a blank test cluster exists.

- name: Set up qdevice clients on Host A and Host B
  hosts: mail_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: corosync_qdevice
      tags: [qdevice, mail]
