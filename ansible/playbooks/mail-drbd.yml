---
# DRBD install + kin-zimbra resource (tasks 2.4 / 2.5).
#
# Dry-run only against live lab:
#   ansible-playbook playbooks/mail-drbd.yml --check
#
# PRODUCTION WARNING: kin-zimbra backs live /opt/zimbra data. Mutating tasks
# (create-md, up, primary) must never use check_mode: false. See
# roles/drbd_resource/tasks/activate.yml.

- name: Set up DRBD kin-zimbra on Host A and Host B
  hosts: mail_nodes
  gather_facts: true
  become: true
  # Live 2vm (25 Aug 2026): mail2 failed the plain-mount release (open holders
  # on the LUKS mapper) while mail1 continued into create-md / drbdadm up and
  # then hit "Can not open backing device". One node must not activate DRBD
  # while its peer is still stuck on the handoff.
  any_errors_fatal: true
  roles:
    - role: drbd_install
      tags: [drbd, install]
    - role: drbd_disk_prep
      tags: [drbd, disk_prep]
    - role: drbd_resource
      tags: [drbd, resource]
