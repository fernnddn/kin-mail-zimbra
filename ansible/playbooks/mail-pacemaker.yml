---
# Pacemaker mail stack from Pacemaker mail-stack stage (promotable DRBD + kin-mail-svc + LDAP HA).
#
# Dry-run only against production cluster:
#   ansible-playbook playbooks/mail-pacemaker.yml --check
#
# PRODUCTION WARNING: pcs resource create / constraint add / promote alter the
# live CIB and can bounce Zimbra/VIP. Mutating pcs tasks must never use
# check_mode: false. See roles/pacemaker_mail_stack/tasks/drbd_clone.yml.

- name: Set up OCF agents and the Pacemaker stack on Host A and Host B
  hosts: mail_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: pacemaker_agents
      tags: [pacemaker, agents]
    - role: pacemaker_mail_stack
      tags: [pacemaker, stack]
