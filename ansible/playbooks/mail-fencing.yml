---
# iSCSI initiator + softdog + SBD/STONITH on Host A/B
# (tasks 2.2 §2-§4, 2.3 kin-softdog, 2.9 SBD_DELAY_START).
#
# Dry-run only against production cluster:
#   ansible-playbook playbooks/mail-fencing.yml --check
#
# Do NOT full-apply on the production HA pair. Soft-reboot / fence proofs
# are intentionally absent from this playbook.

- name: Set up SBD fencing on Host A and Host B
  hosts: mail_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: iscsi_initiator
      tags: [iscsi, initiator]
    - role: softdog
      tags: [softdog]
    - role: sbd_stonith
      tags: [sbd, stonith]
