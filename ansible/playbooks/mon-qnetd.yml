---
# Port of Phase 2 task 2.1 - corosync-qnetd on the Monitoring VM only.
# Scope: install + TLS NSS init (if needed) + enable/start + verify listen :5403.
# Out of scope: OS prep, iSCSI SBD target, qdevice clients on Host A/B.
#
# Dry-run (preferred until a blank test VM exists):
#   ansible-playbook playbooks/mon-qnetd.yml --check
#
# Do NOT run without --check against the production cluster cluster unless you intend
# to mutate that host - production qnetd/DRBD/Pacemaker already run there.

- name: Set up the qnetd arbitrator on the Monitoring VM
  hosts: monitoring
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: observability_identity
      tags: [observability, identity]
    - role: corosync_qnetd
      tags: [qnetd, monitoring]
