---
# Built-in metrics for the console Monitoring tab (Prometheus + node_exporter).
#
# Both bind to 127.0.0.1 and are proxied by the console, so this adds no new
# listening port and no second login. Safe to re-run: it is package install
# plus config plus a verify.
#
#   ansible-playbook playbooks/mail-monitoring.yml --check

- name: Install built-in monitoring on the mail nodes
  hosts: mail_nodes
  gather_facts: true
  become: true
  # apt-daily and unattended-upgrades hold the dpkg lock for minutes after a
  # cloud image boots. The apt module's default is to wait 60s and then fail,
  # which stops a deployment on a lock that clears itself. Applied per play so
  # every role's package task inherits it without each one repeating it.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  roles:
    - role: monitoring_stack
      tags: [monitoring]
