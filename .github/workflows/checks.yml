name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # A parse error reaches the server as a half-finished deployment, so this
      # gate runs before anything else.
      - name: Syntax (bash -n)
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(install/*.sh install/lib/*.sh backup/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: no install/*.sh found - refusing silent pass"
            exit 1
          fi
          fail=0
          for f in "${scripts[@]}"; do
            if bash -n "$f"; then
              echo "ok      $f"
            else
              echo "FAILED  $f"; fail=1
            fi
          done
          exit $fail

      # Every test-*.sh, discovered - never a hand-kept list.
      #
      # The list that used to live here was missing three suites, and two of
      # them were the ones covering service-account id alignment and the OCF
      # agent's process handling: the exact code whose failure stopped a
      # deployment at step 12 of 14 on 29 Aug 2026. A suite nobody runs is not
      # a test, and the way to notice is to stop maintaining the list by hand.
      - name: Shell helper test suites
        run: |
          set -uo pipefail
          find install/lib console/deploy backup -name 'test-*.sh' -type f 2>/dev/null \
            | sort > /tmp/kin-shell-suites.txt
          count=$(grep -c . /tmp/kin-shell-suites.txt || true)
          if [ "${count:-0}" -lt 12 ]; then
            echo "ERROR: found only ${count:-0} shell suites - refusing a silent pass"
            exit 1
          fi
          echo "running ${count} shell suites"
          fail=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "=== $t"
            if bash "$t"; then
              echo "ok      $t"
            else
              echo "FAILED  $t"; fail=1
            fi
          done < /tmp/kin-shell-suites.txt
          exit $fail

      - name: Install shellcheck
        run: sudo apt-get -qq update && sudo apt-get -y install shellcheck

      # Errors fail the build. Warnings are reported but tolerated: these
      # scripts intentionally source a config file that shellcheck cannot see.
      - name: ShellCheck (errors fail)
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(install/*.sh install/lib/*.sh backup/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: no install/*.sh found - refusing silent pass"
            exit 1
          fi
          fail=0
          for f in "${scripts[@]}"; do
            echo "--- $f"
            shellcheck -S error -e SC1090,SC1091 "$f" || fail=1
          done
          exit $fail

      - name: ShellCheck (warnings, informational)
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in install/*.sh install/lib/*.sh backup/*.sh; do
            shellcheck -S warning -e SC1090,SC1091 "$f" || true
          done

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # A CRLF in a shell script produces "bad interpreter: /bin/bash^M",
      # which is a confusing failure on the target host.
      - name: Reject CRLF line endings
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(install/*.sh)
          libscripts=(install/lib/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: no install/*.sh found - refusing silent pass"
            exit 1
          fi
          bad=$(file "${scripts[@]}" ${libscripts[@]+"${libscripts[@]}"} | grep -i CRLF || true)
          if [ -n "$bad" ]; then echo "CRLF found:"; echo "$bad"; exit 1; fi
          echo "All scripts use LF (${#scripts[@]} + ${#libscripts[@]} lib files)"

      # Without the executable bit a fresh clone cannot run ./install/01-preflight.sh.
      - name: Require executable bit on scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(install/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: no install/*.sh found - refusing silent pass"
            exit 1
          fi
          fail=0
          for f in "${scripts[@]}"; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "not executable ($mode): $f"; fail=1
            else
              echo "ok  $f"
            fi
          done
          # Sourced libraries need not be executable.
          for f in install/lib/*.sh; do
            [ -f "$f" ] || continue
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ -n "$mode" ] && [ "$mode" != "100644" ] && [ "$mode" != "100755" ]; then
              echo "unexpected mode ($mode): $f"; fail=1
            else
              echo "ok  $f (lib mode ${mode:-untracked})"
            fi
          done
          exit $fail

      # These scripts were written against a live customer environment. This
      # gate exists so no address, key or token can be reintroduced by accident.
      # Includes cover installer scripts, markdown, NOTICE, Ansible YAML /
      # Jinja, and Python (console/backend, monitoring/zabbix, install/lib).
      - name: Scan for leaked deployment data
        run: |
          fail=0
          includes=(
            --include='*.sh' --include='*.md' --include='NOTICE'
            --include='*.yml' --include='*.yaml' --include='*.j2'
            --include='*.py'
          )
          scan() {
            if grep -RInE "$1" "${includes[@]}" . ; then
              echo ">>> $2"; fail=1
            fi
          }
          # Private IPs: same includes as scan(), with narrow carve-outs.
          # HA-RUNBOOK.md and register_hosts.py used to be exempted here (they
          # named this lab's real 10.10.40.x addresses directly) - both were
          # rewritten to use placeholders/a gitignored local config instead
          # (see docs/HA-RUNBOOK.values.md, register_hosts.local.json), so
          # they're no longer exempt and this gate now actually protects them
          # against a real address being reintroduced by accident.
          #   *.example.yml - committed example inventories (illustrative
          #                            lab-style IPs, not a live deployment's)
          #   checks.yml - this workflow; the 10.x / 192.168 /
          #                            172.16 regex lines self-match
          #   defaults/ - role defaults/main.yml ship lab IPs as
          #                            documented examples; playbooks/tasks/j2
          #                            stay fully gated
          #   test_corosync_stub.py  - Corosync stub fixtures (lab 10.10.40.x
          #                            ring addresses and peer_ip kwargs)
          #   test_*.py              - unit fixtures must name RFC1918 (and
          #                            CGNAT) addresses to prove classifiers;
          #                            token/key scan() still covers tests
          scan_private_ip() {
            if grep -RInE "$1" "${includes[@]}" \
                 --exclude='*.example.yml' \
                 --exclude='checks.yml' \
                 --exclude='test_corosync_stub.py' \
                 --exclude='test_*.py' \
                 --exclude-dir=defaults \
                 . ; then
              echo ">>> $2"; fail=1
            fi
          }
          scan 'BEGIN (RSA |EC )?PRIVATE KEY'              "private key committed"
          scan '(cfat_|ghp_|github_pat_)[A-Za-z0-9_]{10,}' "API token committed"
          # Require a token-length literal. A looser pattern also matches the
          # line that legitimately writes the file from a variable.
          scan 'dns_cloudflare_api_token *= *[A-Za-z0-9_-]{25,}' "Cloudflare token value"
          # Full four-octet match only. A looser pattern matches version
          # strings such as "10.1.18" and fails the build on nothing.
          scan_private_ip '\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b'                   "private IP 10.0.0.0/8"
          scan_private_ip '\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b'                         "private IP 192.168.0.0/16"
          scan_private_ip '\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b'       "private IP 172.16.0.0/12"

          # Real deployment domains. Addresses were gated from the start but
          # names were not, so two of them accumulated quietly across fixtures
          # and comments until someone went looking. A hostname is not a
          # credential, but it is still a customer's estate published to a
          # public repository.
          #
          # Lines asserting a name is ABSENT are the point of the exercise and
          # are allowed through: those guards are what keep generated
          # inventories clean, and they have to name what they forbid.
          # Use example.test / example.com for fixtures.
          scan_domain() {
            if grep -RInE "$1" "${includes[@]}" . | grep -v 'assertNot'; then
              echo ">>> $2"; fail=1
            fi
          }
          scan_domain 'nisaroti\.my\.id'   "real deployment domain (use example.test)"
          scan_domain 'gits-it\.site'      "real deployment domain (use example.test)"
          scan_domain 'helgaalan\.my\.id'  "real deployment domain (use example.test)"
          exit $fail

      - name: Confirm internal documents are ignored
        run: |
          fail=0
          for f in secret.docx design.pdf config cloudflare.ini server.key; do
            if git check-ignore -q "$f"; then
              echo "ok  $f is ignored"
            else
              echo "NOT IGNORED: $f"; fail=1
            fi
          done
          exit $fail

  # Catch playbook YAML/Jinja syntax errors. Not ansible-lint: default/galaxy
  # profiles fail on cosmetic nits (var-naming, meta author) already reviewed.
  ansible:
    name: Ansible syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-core and yamllint
        run: pip install 'ansible-core>=2.16,<2.19' yamllint

      - name: Playbook syntax-check
        working-directory: ansible
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Discovered, not listed. A hand-maintained list silently stopped
          # covering mail-monitoring.yml and both observability playbooks the
          # moment they were added, which is exactly when a syntax error is
          # most likely.
          plays=(playbooks/*.yml)
          if [ ${#plays[@]} -eq 0 ]; then
            echo "ERROR: no ansible playbooks found - refusing silent pass"
            exit 1
          fi
          fail=0
          check() {
            local inv=$1 play=$2
            echo "=== $play  (-i $inv)"
            if ansible-playbook --syntax-check -i "$inv" "$play"; then
              echo "ok  $play"
            else
              echo "FAILED  $play"; fail=1
            fi
          }
          for p in "${plays[@]}"; do
            # add-host / remove-host describe hosts the lab inventory does not
            # have; everything else dry-runs against the lab example.
            case "$p" in
              *mail-add-host.yml)    check inventory/add-host.example.yml "$p" ;;
              *mail-remove-host.yml) check inventory/remove-host.example.yml "$p" ;;
              *)                     check inventory/lab.example.yml "$p" ;;
            esac
          done
          echo "checked ${#plays[@]} playbook(s)"
          exit $fail

      # Relaxed profile, warnings do not fail. Catches broken YAML; skips
      # line-length / document-start / truthy / comment nits.
      - name: yamllint (errors only)
        working-directory: ansible
        run: |
          set -euo pipefail
          yamllint -d '{extends: relaxed, rules: {line-length: disable, comments: disable, comments-indentation: disable, document-start: disable, truthy: disable}}' .

      # A gated (when:) task and an ungated task sharing a register: name
      # broke cluster_setup on a greenfield host (2026-08-21): the skipped
      # task's result clobbered the real probe with a dict that has no
      # .rc/.stat. This guard fails the build if that pattern reappears.
      - name: cluster_setup register shadowing guard
        run: python3 ansible/roles/cluster_setup/scripts/check_register_shadowing.py

  console:
    name: Console build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json

      # Vite does not run tsc. A missing import can still produce a production
      # bundle (pre-release audit: useDeploySession). Fail the job on type errors.
      - name: Frontend type-check
        working-directory: console/frontend
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "ERROR: console/frontend/package.json missing - refusing silent pass"
            exit 1
          fi
          npm ci
          npx tsc --noEmit

      # parseHaOrchProgress drives the only progress an operator sees during a
      # 20+ minute Build HA pair, and it has had two separate freezing bugs
      # (START-only advancement, and \s* swallowing a newline). Pin it down.
      - name: Frontend unit tests
        working-directory: console/frontend
        run: |
          set -euo pipefail
          if [ ! -f test/deployPipeline.test.mjs ]; then
            echo "ERROR: frontend tests missing - refusing silent pass"
            exit 1
          fi
          npm test

      - name: Frontend production build
        working-directory: console/frontend
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "ERROR: console/frontend/package.json missing - refusing silent pass"
            exit 1
          fi
          npm run build

      # bootstrap.sh rsyncs the committed dist/, not a fresh Vite build. A
      # source-only commit ships a stale UI (df7d469: Topology VIP missing).
      - name: Committed dist must match this build
        working-directory: console/frontend
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain -- dist)
          if [ -n "$dirty" ]; then
            echo "ERROR: console/frontend/dist does not match npm run build."
            echo "bootstrap.sh deploys this tree. Rebuild and commit:"
            echo "  (cd console/frontend && npm ci && npm run build)"
            echo "$dirty"
            git diff --stat -- dist || true
            exit 1
          fi
          js=(dist/assets/*.js)
          if [ ! -f "${js[0]:-}" ]; then
            echo "ERROR: no dist/assets/*.js after build - refusing silent pass"
            exit 1
          fi
          echo "ok  committed dist matches npm run build (${js[*]})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend syntax and import check
        run: |
          set -euo pipefail
          if [ ! -d console/backend/kin_console ]; then
            echo "ERROR: console/backend missing - refusing silent pass"
            exit 1
          fi
          python3 -m compileall -q console/backend
          python3 -m pip install -r console/backend/requirements.txt
          PYTHONPATH=console/backend python3 -m unittest discover -s console/backend/tests -v
          PYTHONPATH=console/backend python3 -c "
          from kin_console.app import app
          from kin_privhelper import protocol, rbac, commands
          print('imports ok', app.title)
          "

  # The backend unit tests on every interpreter that actually runs them.
  #
  # The console job above pins 3.11. The appliance is Ubuntu 22.04, which is
  # Python 3.10, and those two disagree in ways that are invisible on 3.11:
  # asyncio.TimeoutError is an alias of the builtin TimeoutError from 3.11
  # onwards and a distinct class before it. A bare `except TimeoutError` around
  # an `await asyncio.wait_for(...)` therefore passed every check here and
  # caught nothing on the customer's box, which is how the deploy log's sidecar
  # tail shipped dead in 0.1.7 and was found by running the suite on the
  # workstation rather than in CI.
  #
  # 3.11 is kept, not replaced: it is what the console job builds against.
  backend-interpreters:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the appliance. 3.11 is what the console job uses.
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install backend requirements
        run: |
          set -euo pipefail
          if [ ! -f console/backend/requirements.txt ]; then
            echo "ERROR: console/backend/requirements.txt missing - refusing silent pass"
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -r console/backend/requirements.txt

      - name: Syntax and import check
        run: |
          set -euo pipefail
          python -m compileall -q console/backend
          PYTHONPATH=console/backend python -c "
          from kin_console.app import app
          from kin_privhelper import protocol, rbac, commands
          print('imports ok', app.title)
          "

      - name: Unit tests
        run: |
          set -euo pipefail
          count=$(find console/backend/tests -name 'test_*.py' -type f | wc -l)
          if [ "${count:-0}" -lt 40 ]; then
            echo "ERROR: found only ${count:-0} backend test modules - refusing a silent pass"
            exit 1
          fi
          echo "running ${count} backend test modules on Python ${{ matrix.python }}"
          PYTHONPATH=console/backend python -m unittest discover -s console/backend/tests -v
